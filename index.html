function drawTrend(hist){
  const W=620,H=220,padL=34,padR=14,padT=16,padB=30;
  const xs=hist.map((h,i)=>hist.length>1?padL+(W-padL-padR)*i/(hist.length-1):padL+(W-padL-padR)/2);
  const ys=hist.map(h=>padT+(H-padT-padB)*(1-(h.overall||0)/100));
  let grid='',labels='';
  [0,25,50,75,100].forEach(v=>{
    const y=padT+(H-padT-padB)*(1-v/100);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#3a3128" stroke-width="1"/>`;
    labels+=`<text x="${padL-7}" y="${y+3}" fill="#8a7f6d" font-size="9.5" font-family="JetBrains Mono,monospace" text-anchor="end">${v}</text>`;
  });
  const tgt=STATE.targetScore||85;
  const ty=padT+(H-padT-padB)*(1-tgt/100);
  const tgtLine=`<line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" stroke="#8fae6e" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="${W-padR}" y="${ty-5}" fill="#8fae6e" font-size="9.5" font-family="JetBrains Mono,monospace" text-anchor="end">target ${tgt}</text>`;
  let path='';
  xs.forEach((x,i)=>{ path+=(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)+' '; });
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="#e9a23b"/>
    <text x="${x.toFixed(1)}" y="${(ys[i]-9).toFixed(1)}" fill="#f1e9dc" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">${hist[i].overall}</text>`).join('');
  const xlabels=hist.map((h,i)=>`<text x="${xs[i].toFixed(1)}" y="${H-10}" fill="#8a7f6d" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">D${h.day}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}${tgtLine}${labels}
    <path d="${path}" fill="none" stroke="#e9a23b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlabels}
  </svg>`;
}

  const t=e.target.closest('.tab'); if(t) switchTab(t.dataset.v);
});

/* ---------------- SETTINGS ---------------- */
document.getElementById('setupBtn').addEventListener('click',openSettings);
function openSettings(){
  const box=document.getElementById('modalBox');
  box.innerHTML=`
    <h3>Settings</h3>
    <p>Program started <b>${STATE.startDate}</b> · today is suggested Day ${suggestedDay()} ·
    ${STATE.recordings.length} recordings · ${STATE.weakSpots.length} drills.</p>

    <label class="fld">Day-60 target Accent Score</label>
    <p style="margin:6px 0 8px">Your goal line on the Progress chart. ${baselineAccentScore()!=null?'Your baseline is '+baselineAccentScore()+'.':'Set after your first benchmark.'}</p>
    <input type="number" id="mTarget" min="40" max="100" value="${STATE.targetScore||85}">

    <label class="fld" style="margin-top:18px">Baseline</label>
    <p style="margin:6px 0 8px">${STATE.baseline?('Captured from Day '+STATE.baseline.day+' ('+STATE.baseline.date+'). This is your fixed comparison point.'):'Not captured yet. Your first AI assessment becomes your baseline automatically.'}</p>
    ${STATE.baseline?'<button class="btn ghost mini" id="mRebase">Reset baseline to latest assessment</button>':''}

    <label class="fld" style="margin-top:18px">Backup &amp; restore</label>
    <p style="margin:6px 0 0">Export saves your progress, scores, drills and goals as a JSON file
    (audio recordings are not included). Import replaces current data with a backup file.</p>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="mExport">↓ Export backup</button>
      <button class="btn ghost" id="mImport">↑ Import backup</button>
      <input type="file" id="mFile" accept="application/json,.json" style="display:none">
    </div>

    <label class="fld" style="margin-top:20px">Program controls</label>
    <div class="modal-actions" style="justify-content:flex-start">
      <button class="btn ghost" id="mRestart" style="color:var(--coral);border-color:var(--coral)">Restart day counter</button>
      <button class="btn primary" id="mWipe" style="background:var(--coral);border-color:var(--coral)">Erase all data</button>
    </div>
    <div class="modal-actions"><button class="btn primary" id="mSave">Save settings</button><button class="btn ghost" id="mClose">Close</button></div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mSave').onclick=()=>{
    const t=+document.getElementById('mTarget').value;
    if(t>=40&&t<=100) STATE.targetScore=t;
    saveState(); closeModal(); switchTab('dash'); toast('Settings saved.');
  };
  const rb=document.getElementById('mRebase');
  if(rb) rb.onclick=()=>{
    const cur=latestAIScores();
    if(!cur){ toast('No assessment to set baseline from.'); return; }
    STATE.baseline={scores:Object.assign({},cur),date:todayStr(),day:suggestedDay(),fromRec:'manual'};
    saveState(); closeModal(); switchTab('progress'); toast('Baseline reset to your latest scores.');
  };
  document.getElementById('mExport').onclick=exportData;
  document.getElementById('mImport').onclick=()=>document.getElementById('mFile').click();
  document.getElementById('mFile').onchange=importData;
  document.getElementById('mRestart').onclick=()=>{
    STATE.startDate=todayStr(); STATE.viewDay=1; saveState(); closeModal(); switchTab('dash');
    toast('Program counter restarted.');
  };
  document.getElementById('mWipe').onclick=async()=>{
    if(confirm('Erase ALL progress, logs, ratings, drills and recordings? This cannot be undone.')){
      await audioClear();
      STATE={startDate:todayStr(),completed:{},logs:[],viewDay:1,recordings:[],deletedRecordings:[],weakSpots:[],baseline:null,earned:[],targetScore:85};
      await saveState(); closeModal(); switchTab('dash'); toast('All data erased.');
    }
  };
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

function exportData(){
  const payload={app:'accent-studio',version:1,exported:new Date().toISOString(),
    state:{startDate:STATE.startDate,completed:STATE.completed,logs:STATE.logs,
      viewDay:STATE.viewDay,weakSpots:STATE.weakSpots,
      baseline:STATE.baseline,earned:STATE.earned,targetScore:STATE.targetScore,
      recordings:STATE.recordings.map(r=>({...r}))}};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='accent-studio-backup-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup file downloaded.');
}
function importData(e){
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const data=JSON.parse(fr.result);
      const st=data.state||data;
      if(!st||!st.startDate) throw new Error('bad file');
      STATE=Object.assign({startDate:todayStr(),completed:{},logs:[],viewDay:1,recordings:[],deletedRecordings:[],weakSpots:[]},st);
      if(!Array.isArray(STATE.recordings)) STATE.recordings=[];
      if(!Array.isArray(STATE.deletedRecordings)) STATE.deletedRecordings=[];
      if(!Array.isArray(STATE.weakSpots)) STATE.weakSpots=[];
      await saveState(); closeModal(); switchTab('dash');
      toast('Backup restored. (Audio files are not part of backups.)');
    }catch(err){ toast('That file could not be read as a valid backup.'); }
  };
  fr.readAsText(f);
}

/* ---------------- BOOT ---------------- */
(async function(){
  await loadState();
  const user = await cloudUser();
  if(user) await cloudPull();          // if the session is ready at boot, reconcile now
  if(!STATE.startDate){
    // Cosmetic local start date so the UI works. Deliberately NO updatedAt, NO save, NO push:
    // the state stays "pristine" (_seeded false) so a late-arriving session on a fresh
    // magic-link device adopts the cloud instead of clobbering it with defaults.
    STATE.startDate = todayStr();
    try{ await kvSet(STATE_KEY, STATE); }catch(e){}
  }
  if(!STATE.viewDay) STATE.viewDay = suggestedDay();
  render();
  _bootDone = true;                    // arm onAuthStateChange for sign-ins that happen after boot
  if(await cloudUser()) cloudPull();   // catch a session that finished establishing during boot
})();
</script>
</body>
