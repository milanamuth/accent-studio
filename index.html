<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Accent Studio — 60-Day American Accent Trainer</title>
<meta name="description" content="A 60-day structured program to build a natural American accent: daily drills, in-app voice recording, progress dashboard and spaced-repetition weak-spot drills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191512; --panel:#221d18; --panel-2:#2a241d;
    --line-solid:#3a3128; --ink:#f1e9dc; --ink-soft:#c4b9a6; --ink-faint:#8a7f6d;
    --amber:#e9a23b; --coral:#e0734a; --sage:#8fae6e; --sky:#7fa8c4; --plum:#c98bb9;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  body{
    background-image:
      radial-gradient(900px 500px at 88% -8%, rgba(233,162,59,.10), transparent 60%),
      radial-gradient(700px 400px at 5% 102%, rgba(224,115,74,.08), transparent 60%);
    min-height:100vh; padding:0 0 90px;
  }
  ::selection{background:var(--amber);color:#1a140c}
  h1,h2,h3,.serif{font-family:'Fraunces',serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  a{color:var(--amber)}

  header{padding:34px 0 18px;border-bottom:1px solid var(--line-solid);margin-bottom:24px}
  .brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .brand h1{font-size:clamp(28px,4.6vw,46px);font-weight:600;line-height:1.02;margin-top:6px;letter-spacing:-.01em}
  .brand h1 em{font-style:italic;color:var(--coral)}
  .brand p{color:var(--ink-soft);margin-top:8px;font-size:14.5px;max-width:48ch}
  .setup-btn{background:transparent;border:1px solid var(--line-solid);color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;padding:9px 14px;border-radius:8px;cursor:pointer;transition:.2s}
  .setup-btn:hover{border-color:var(--amber);color:var(--amber)}

  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:24px;background:var(--panel);
    padding:5px;border-radius:13px;border:1px solid var(--line-solid);width:fit-content}
  .tab{font-family:'Hanken Grotesk';font-weight:600;font-size:13px;color:var(--ink-faint);
    background:transparent;border:0;padding:9px 15px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--amber);color:#1a140c}

  .view{display:none;animation:fade .35s ease}
  .view.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line-solid);border-radius:15px;padding:22px}
  .grid{display:grid;gap:16px}
  .section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}

  .dash-top{display:grid;grid-template-columns:300px 1fr;gap:16px}
  @media(max-width:780px){.dash-top{grid-template-columns:1fr}}
  .ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring-wrap{position:relative;width:188px;height:188px}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center .big{font-family:'Fraunces',serif;font-size:52px;font-weight:600;line-height:1}
  .ring-center .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-faint);text-transform:uppercase;margin-top:3px}
  .ring-sub{margin-top:14px;color:var(--ink-soft);font-size:13.5px}
  .ring-sub b{color:var(--amber)}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .stat{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;padding:16px 17px;position:relative;overflow:hidden}
  .stat .num{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1}
  .stat .cap{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
  .stat .glyph{position:absolute;right:12px;top:10px;font-size:20px;opacity:.5}
  .stat.s-streak .num{color:var(--coral)} .stat.s-min .num{color:var(--amber)}
  .stat.s-done .num{color:var(--sage)} .stat.s-rec .num{color:var(--sky)}

  .radar-card,.heat-card{margin-top:16px}
  .radar-flex{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:center}
  @media(max-width:680px){.radar-flex{grid-template-columns:1fr}}
  .legend{display:flex;flex-direction:column;gap:9px}
  .legend .row{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .legend .bar-track{flex:1;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden}
  .legend .bar-fill{height:100%;border-radius:4px}
  .legend .val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);width:34px;text-align:right}

  .heat{display:flex;flex-wrap:wrap;gap:4px}
  .heat .cell{width:15px;height:15px;border-radius:3.5px;background:var(--panel-2);border:1px solid var(--line-solid)}
  .heat .cell.l1{background:rgba(233,162,59,.28)} .heat .cell.l2{background:rgba(233,162,59,.55)}
  .heat .cell.l3{background:var(--amber)}
  .heat .cell.today{box-shadow:0 0 0 2px var(--coral)}
  .heat-key{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--ink-faint)}
  .heat-key .cell{width:12px;height:12px;border-radius:3px}

  /* dashboard drills */
  .dash-drill{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 13px;background:var(--panel-2);border:1px solid var(--line-solid);border-radius:11px;margin-bottom:8px}
  .dash-drill:last-child{margin-bottom:0}
  .dd-label{font-weight:700;font-size:14px}
  .dd-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:2px}

  /* today */
  .day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .day-nav{display:flex;gap:6px;align-items:center}
  .navbtn{background:var(--panel-2);border:1px solid var(--line-solid);color:var(--ink-soft);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;transition:.18s}
  .navbtn:hover{border-color:var(--amber);color:var(--amber)}
  .navbtn:disabled{opacity:.3;cursor:not-allowed}
  .phase-pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:20px;
    background:rgba(233,162,59,.13);color:var(--amber);border:1px solid rgba(233,162,59,.25)}
  .day-title{font-family:'Fraunces',serif;font-size:clamp(24px,3.6vw,34px);font-weight:600;margin:10px 0 4px;letter-spacing:-.01em}
  .day-why{color:var(--ink-soft);font-size:14.5px;font-style:italic;font-family:'Fraunces',serif;max-width:62ch}
  .day-meta{display:flex;gap:18px;margin:16px 0 4px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);
    font-family:'JetBrains Mono',monospace}
  .day-meta b{color:var(--ink-soft)}

  .ex{display:flex;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line-solid)}
  .ex:last-child{border-bottom:0}
  .ex .check{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-solid);
    background:var(--panel-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.16s;margin-top:1px;font-size:14px;color:transparent}
  .ex .check:hover{border-color:var(--amber)}
  .ex.done .check{background:var(--sage);border-color:var(--sage);color:#1a140c}
  .ex .body{flex:1}
  .ex .etitle{font-weight:700;font-size:15px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .ex .emin{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--amber);
    border:1px solid rgba(233,162,59,.3);padding:2px 7px;border-radius:20px}
  .ex .edesc{color:var(--ink-soft);font-size:13.5px;margin-top:5px;line-height:1.55}
  .ex.done .etitle,.ex.done .edesc{opacity:.5;text-decoration:line-through;text-decoration-color:var(--ink-faint)}
  .listen{margin-top:16px;background:var(--panel-2);border:1px solid var(--line-solid);
    border-left:3px solid var(--sky);border-radius:0 11px 11px 0;padding:13px 16px;font-size:13.5px;color:var(--ink-soft)}
  .listen b{color:var(--sky);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  .day-progress{margin-top:18px;display:flex;align-items:center;gap:13px}
  .dp-track{flex:1;height:8px;background:var(--panel-2);border-radius:5px;overflow:hidden}
  .dp-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));border-radius:5px;transition:.4s}
  .dp-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}

  .btn{font-family:'Hanken Grotesk';font-weight:700;font-size:13.5px;border-radius:10px;
    padding:11px 18px;cursor:pointer;border:1px solid var(--line-solid);transition:.18s;color:var(--ink)}
  .btn.primary{background:var(--amber);color:#1a140c;border-color:var(--amber)}
  .btn.primary:hover{background:#f2b257}
  .btn.ghost{background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
  .btn.mini{padding:7px 12px;font-size:12px;border-radius:8px}

  /* recorder */
  .rec-stage{display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;padding:22px 18px}
  .rec-start{background:var(--coral);border-color:var(--coral);color:#1a140c;font-size:15px;
    display:flex;align-items:center;gap:9px;padding:13px 24px}
  .rec-start:hover{background:#e8855f}
  .rec-dot{width:11px;height:11px;border-radius:50%;background:#1a140c;display:inline-block}
  .rec-hint{color:var(--ink-faint);font-size:12.5px;text-align:center;max-width:46ch}
  .rec-stage.recording{border-color:rgba(224,115,74,.5)}
  .rec-pulse{width:26px;height:26px;border-radius:50%;background:var(--coral);
    animation:pulse 1.1s infinite ease-in-out}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
  .rec-timer{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--coral)}
  .rec-stop{background:transparent;border-color:var(--coral);color:var(--coral)}
  .rec-stop:hover{background:rgba(224,115,74,.12)}
  .rec-stage.review{align-items:stretch}
  .rec-review-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);text-align:center}
  .rec-bench{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:10px;cursor:pointer}
  .rec-bench input{width:16px;height:16px;accent-color:var(--amber)}
  .rec-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
  .rec-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .rec-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel-2);border:1px solid var(--line-solid);border-radius:11px;padding:11px 13px}
  .rec-play{flex:none;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#1a140c;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:.15s}
  .rec-play:hover{background:#f2b257}
  .rec-meta{flex:1;min-width:140px}
  .rec-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rec-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:3px}
  .rec-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    background:rgba(127,168,196,.16);color:var(--sky);padding:2px 7px;border-radius:20px;border:1px solid rgba(127,168,196,.3)}
  .rec-del{flex:none;background:transparent;border:1px solid var(--line-solid);color:var(--ink-faint);
    width:30px;height:30px;border-radius:8px;cursor:pointer;transition:.15s}
  .rec-del:hover{border-color:var(--coral);color:var(--coral)}
  .inline-pl{width:100%;margin-top:6px;height:38px}
  .rec-daygroup{margin-bottom:18px}
  .rec-daygroup:last-child{margin-bottom:0}
  .rec-dayhead{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:9px;
    padding-bottom:7px;border-bottom:1px solid var(--line-solid)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:620px){.cmp{grid-template-columns:1fr}}
  .cmp-slot{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:12px;padding:14px}
  .cmp-hint{color:var(--ink-soft);font-size:13px;margin-bottom:14px}

  /* drills */
  .drill-card{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;
    padding:15px 16px;margin-bottom:10px}
  .drill-card.due{border-color:rgba(233,162,59,.4)}
  .drill-card.mastered{opacity:.62}
  .drill-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .drill-label{font-weight:700;font-size:15px}
  .drill-note{color:var(--ink-soft);font-size:13px;margin-top:6px;line-height:1.5}
  .drill-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
  .drill-due{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint)}
  .drill-card.due .drill-due{color:var(--amber)}
  .drill-card.mastered .drill-due{color:var(--sage)}
  .drill-actions{display:flex;gap:8px;flex-wrap:wrap}
  .sr-dots{display:flex;gap:5px}
  .sr-dot{width:9px;height:9px;border-radius:50%;background:var(--line-solid)}
  .sr-dot.on{background:var(--amber)}
  .drill-card.mastered .sr-dot.on{background:var(--sage)}
  .add-spot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.add-spot{grid-template-columns:1fr}}

  /* forms */
  .slider-row{margin-bottom:15px}
  .slider-row .sl-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px}
  .slider-row .sl-head .sv{font-family:'JetBrains Mono',monospace;color:var(--amber)}
  input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:var(--panel-2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--amber);cursor:pointer;border:3px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);
    cursor:pointer;border:3px solid var(--panel)}
  input[type=number],input[type=text],textarea,select{font-family:'Hanken Grotesk';background:var(--panel-2);
    border:1px solid var(--line-solid);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px;width:100%}
  textarea{resize:vertical;min-height:62px}
  label.fld{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}

  .logitem{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-solid)}
  .logitem:last-child{border-bottom:0}
  .logitem .ld{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);width:92px;flex:none}
  .logitem .lmain{flex:1}
  .logitem .lday{font-weight:700;font-size:14px}
  .logitem .lnotes{color:var(--ink-soft);font-size:13px;margin-top:3px}
  .logitem .lscore{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);flex:none}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-style:italic;font-family:'Fraunces',serif}

  .phase-block{margin-bottom:14px}
  .phase-bar{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--panel-2);
    border:1px solid var(--line-solid);border-radius:12px}
  .phase-bar .pn{font-family:'Fraunces',serif;font-size:18px;font-weight:600;flex:1}
  .phase-bar .pdays{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint)}
  .phase-bar .ptrack{width:120px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
  .phase-bar .pfill{height:100%;background:var(--amber);border-radius:4px}
  .daylist{margin-top:8px;display:grid;gap:6px}
  .dayrow{display:flex;align-items:center;gap:13px;padding:11px 14px;background:var(--panel);
    border:1px solid var(--line-solid);border-radius:10px;cursor:pointer;transition:.16s}
  .dayrow:hover{border-color:var(--amber);transform:translateX(3px)}
  .dayrow .dnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);width:46px;flex:none}
  .dayrow .dttl{flex:1;font-size:14px;font-weight:600}
  .dayrow .dstate{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:20px}
  .dayrow.done{border-color:rgba(143,174,110,.4)}
  .dayrow.done .dstate{background:rgba(143,174,110,.16);color:var(--sage)}
  .dayrow.partial .dstate{background:rgba(233,162,59,.14);color:var(--amber)}
  .dayrow.todo .dstate{background:var(--panel-2);color:var(--ink-faint)}
  .dayrow.current{border-color:var(--coral)}

  .modal-bg{position:fixed;inset:0;background:rgba(10,8,6,.78);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-solid);border-radius:16px;
    padding:26px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{font-size:22px;font-weight:600;margin-bottom:6px}
  .modal p{color:var(--ink-soft);font-size:13.5px;margin-bottom:14px;line-height:1.55}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--sage);color:#15140c;font-weight:700;font-size:13.5px;padding:12px 22px;
    border-radius:11px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .res h3{font-size:20px;font-weight:600;margin:22px 0 10px}
  .res h3:first-child{margin-top:0}
  .res p,.res li{color:var(--ink-soft);font-size:14px;line-height:1.65}
  .res ul{padding-left:20px;margin:8px 0}
  .res li{margin:5px 0}
  .res .tag{font-family:'JetBrains Mono',monospace;color:var(--amber);font-size:13px}
  .ipa{font-family:'JetBrains Mono',monospace;color:var(--coral)}
  .loading{text-align:center;padding:60px;color:var(--ink-faint);font-family:'Fraunces',serif;font-style:italic}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brandrow">
      <div class="brand">
        <div class="kicker">60-Day Program · Spoken American English</div>
        <h1>The Accent <em>Studio</em></h1>
        <p>Daily drills, in-app voice recording and spaced-repetition practice for a natural American accent.</p>
      </div>
      <button class="setup-btn" id="setupBtn">⚙ Settings</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-v="dash">Dashboard</button>
    <button class="tab" data-v="today">Today</button>
    <button class="tab" data-v="plan">Full Plan</button>
    <button class="tab" data-v="drills">Drills</button>
    <button class="tab" data-v="progress">Progress</button>
    <button class="tab" data-v="recordings">Recordings</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>

<script src="js/drill-engine.js?v=1"></script>
<script>
/* ============================================================
   THE ACCENT STUDIO — standalone build (host anywhere)
   Storage: IndexedDB (state + audio). No backend required.
   ============================================================ */
const PHASES = [
  {id:1,name:"Foundation & The American R",range:[1,7],
   blurb:"Set a baseline and master rhoticity — the single biggest tell of an American accent."},
  {id:2,name:"The Vowel System",range:[8,14],
   blurb:"Rebuild your vowels. American English vowels sit in different places than most other accents."},
  {id:3,name:"Consonants & Connected Speech",range:[15,21],
   blurb:"Flap T, glottal T, dark L and the linking that makes speech flow."},
  {id:4,name:"Rhythm, Stress & Music",range:[22,30],
   blurb:"Stress-timing and intonation — the melody that makes you sound native, not just correct."},
  {id:5,name:"Refinement & Real-World Application",range:[31,60],
   blurb:"Move from drills to spontaneous, conversational speech under real conditions."},
];

/* helper to build an exercise */
const x=(t,d,min)=>({t,d,min});

/* The 60-day curriculum. Each day: phase, title, why, exercises[], listen */
const PLAN=[
/* ---------- PHASE 1 ---------- */
{p:1,title:"Baseline & The American Mouth",
 why:"You cannot improve what you have not measured. Today you capture your starting point.",
 ex:[
  x("Record your baseline","Read the 'Rainbow Passage' (search it — public domain) aloud at natural pace. Save the audio. This is your Day 1 fingerprint.",8),
  x("Mouth posture reset","Americans speak with a slightly relaxed jaw and the tongue held a touch further back. Say 'aaah' then settle into a neutral, loose-jaw resting position. Hold 60s.",5),
  x("Vowel sweep","Slowly glide through: heed–hid–hayed–head–had–hod–hawed–hoed–hood–who'd. Feel each mouth shape. Repeat 5x.",7),
  x("Self-assessment","Listen back to your recording. Note your 3 most obvious non-American features (often the R, the T, or flat rhythm).",5),
 ],
 listen:"Pick ONE American voice to be your model for 60 days — a podcaster, actor or YouTuber whose voice you like. Consistency of model beats variety."},

{p:1,title:"Finding the American R",
 why:"The American R is a constriction, not a tongue tap or trill. Build it once, use it everywhere.",
 ex:[
  x("The bunched R","Pull the back/sides of your tongue up toward your back teeth, tongue tip down and floating. Make a low growl: 'rrrrr'. No tip contact, no trill.",6),
  x("R sustain","Hold a clean 'rrrr' for 8 seconds, 6 times. It should feel like a vowel you can sing.",5),
  x("R + vowel glides","rrr-ah, rrr-ee, rrr-oh, rrr-oo. Keep the R constriction, then open into the vowel. 8 reps each.",8),
  x("Mirror check","Watch your mouth. Your tongue tip should NOT touch the roof or teeth. Record 'red, right, around' and verify.",6),
 ],
 listen:"Listen for the R in your model's speech. Notice it appears even where your accent might drop it."},

{p:1,title:"R at the Start of Words",
 why:"Initial R sets the tone of a word. Lock it in before stacking complexity.",
 ex:[
  x("Warm-up R sustain","30 seconds of clean bunched 'rrrr' to re-find the position.",3),
  x("Initial-R word ladder","red, run, right, road, rain, real, rich, room, rest, ready. 3 slow passes, then 2 at speed.",8),
  x("R in phrases","'a red road', 'run right round', 'really rich rooms'. Keep every R constricted.",7),
  x("Shadow & record","Shadow 2 minutes of your model. Then record yourself reading the word ladder; compare the R quality.",7),
 ],
 listen:"Count initial-R words in 1 minute of your model. Note how effortless their R sounds."},

{p:1,title:"The NURSE Vowel — Stressed ER",
 why:"Words like 'bird' and 'work' use an R-colored vowel. Mastering it removes a major accent tell.",
 ex:[
  x("Build the ER","From the bunched R, add voice and a tiny bit of mouth opening: 'errrr'. This single sound IS the vowel in 'bird'.",6),
  x("NURSE word set","bird, word, work, her, first, learn, turn, world, nurse, early. Each one is just 'ER' wrapped in consonants. 3 passes.",8),
  x("Minimal contrast","Compare a non-rhotic 'er' (cut short) vs full American ER. Exaggerate the American version 5x per word.",6),
  x("Shadow & record","Shadow 2 min of model speech, then record the NURSE set. Confirm the R-color lasts the whole vowel.",6),
 ],
 listen:"Track every 'bird/work/her'-type word in your model for 2 minutes."},

{p:1,title:"The Schwa-R — Unstressed ER",
 why:"Endings like 'water' and 'mother' use a quick, light R-colored schwa. Get this and you sound natural instantly.",
 ex:[
  x("Light ER","Same R-color as NURSE but shorter, lower energy, unstressed: the end of 'teacher'.",5),
  x("lettER word set","water, mother, better, after, never, under, doctor, dollar, sister, summer. Light, quick final ER. 3 passes.",8),
  x("Two-syllable rhythm","Say each word as STRONG-weak: 'WA-ter', not 'wa-TER'. The ER must stay unstressed but still R-colored.",6),
  x("Shadow & record","Shadow 2 min, then record the set. The final ER should be present but never heavy.",6),
 ],
 listen:"Notice how your model's word-final ER is quick and light, never dropped, never stressed."},

{p:1,title:"R After Vowels",
 why:"'car', 'hard', 'more', 'here' — post-vowel R is where non-rhotic accents most often slip.",
 ex:[
  x("Warm-up","20s R sustain + 'water/bird' to re-find both ER types.",3),
  x("R-cluster ladder","car, hard, far, more, four, here, near, fear, hair, care, fire, hour. Glide vowel INTO the R, do not drop it.",9),
  x("Sentence drill","'The car is parked far from here.' 'There are four more hours.' Hit every R.",7),
  x("Shadow & record","Shadow 3 min of model, record the sentences, compare every R.",6),
 ],
 listen:"Pick any sentence your model says with 3+ R's and replay it 5 times."},

{p:1,title:"R Consolidation + Re-record",
 why:"End of week 1. Prove your rhoticity has improved against a fresh measurement.",
 ex:[
  x("Full R review","Run through: initial R, NURSE, lettER, post-vowel R. 2 minutes total, all word sets.",8),
  x("R-loaded passage","Read aloud: 'Rural travelers rarely return early — they prefer warmer mornings near the harbor.' 5 slow, 3 fast.",7),
  x("Re-record baseline","Record the Rainbow Passage again. Compare directly with your Day 1 audio.",8),
  x("Progress note","Rate your R alone vs Day 1. Log a tracker session and rate all six skills honestly.",4),
 ],
 listen:"Listen to Day 1 and Day 7 recordings back to back. The R difference should be audible."},

/* ---------- PHASE 2 ---------- */
{p:2,title:"The Bright TRAP Vowel",
 why:"The American 'a' in 'cat' is brighter and more open than in most accents. It is highly recognizable.",
 ex:[
  x("Open the TRAP","Drop your jaw, spread slightly, raise the tongue front: a bright 'æ' as in 'cat'. Exaggerate it.",5),
  x("TRAP word set","cat, bad, man, hand, ask, last, dance, can, family, happy. Keep that bright open vowel. 3 passes.",8),
  x("The nasal lift","Before n/m the TRAP vowel lifts and tenses ('man', 'hand', 'can'). Practice this slight glide.",7),
  x("Shadow & record","Shadow 3 min, record the set, confirm the vowel is bright and forward, not dull.",7),
 ],
 listen:"Catch every 'cat/man/dance' vowel in 2 minutes of your model."},

{p:2,title:"The Merged LOT–THOUGHT Vowel",
 why:"Most General American speakers pronounce 'cot' and 'caught' identically — one open back vowel.",
 ex:[
  x("Find the vowel","An open, relaxed 'ah' with the jaw low: the vowel in 'hot' and 'dog'.",5),
  x("Merged word set","hot, dog, on, off, lost, talk, call, want, thought, coffee — all share one open 'ah'-ish vowel. 3 passes.",8),
  x("No rounding","Avoid heavy lip-rounding on 'caught/thought'. Keep it open and relaxed like 'cot'.",6),
  x("Shadow & record","Shadow 3 min, record the set, verify cot=caught for you.",7),
 ],
 listen:"Notice your model does not distinguish 'cot' and 'caught' — most Americans do not."},

{p:2,title:"Tense vs Lax — sheep / ship",
 why:"American English contrasts long-tense and short-lax vowels. Mixing them up is a clear accent marker.",
 ex:[
  x("FLEECE vs KIT","'sheep' (long, smiley, tense) vs 'ship' (short, relaxed). Exaggerate the difference 10x.",6),
  x("GOOSE vs FOOT","'pool' (long, rounded) vs 'pull' (short, relaxed). 10 contrast reps.",6),
  x("Minimal pair drill","sheep/ship, feel/fill, leave/live, pool/pull, fool/full. Say each pair 5x, partner cannot guess wrongly.",8),
  x("Shadow & record","Shadow 3 min, record the pairs, confirm clear length + quality contrast.",6),
 ],
 listen:"Listen for tense vs lax pairs in your model — the difference is length AND mouth shape."},

{p:2,title:"The Schwa — Engine of Rhythm",
 why:"The schwa is the most common sound in English. Reducing unstressed vowels to schwa is THE secret to American rhythm.",
 ex:[
  x("Pure schwa","A tiny, neutral, lazy 'uh' — zero effort. The first sound of 'about', last of 'sofa'.",5),
  x("Reduce unstressed vowels","banana → buh-NAN-uh. photograph → PHO-tuh-graf. Every unstressed vowel collapses to schwa.",8),
  x("Function-word reduction","'to, of, for, the, a, and, can' all reduce: 'I want to go' → 'I wanna go', 'cup of tea' → 'cup-uh-tea'.",8),
  x("Shadow & record","Shadow 3 min focusing only on reduced syllables. Record a paragraph and check your schwas.",6),
 ],
 listen:"This is the big one. Notice how MUCH of your model's speech is unstressed schwa."},

{p:2,title:"GOAT & FACE Glides",
 why:"American 'go' and 'day' are gliding diphthongs. Flattening them into pure vowels sounds non-native.",
 ex:[
  x("FACE glide","'day' = eh→ee glide. Slow it: 'eh-ee'. Then natural speed. Words: day, make, play, name, late.",6),
  x("GOAT glide","'go' = oh→oo glide, starting more central in American English. Words: go, no, know, home, boat, slow.",7),
  x("Glide vs flat","Say 'go' flat (non-American) then with the full glide. Exaggerate the glide 8x.",6),
  x("Shadow & record","Shadow 3 min, record the GOAT/FACE sets, confirm audible glides.",6),
 ],
 listen:"Hear the movement inside 'no' and 'day' — these are never single static vowels."},

{p:2,title:"PRICE, MOUTH & CHOICE",
 why:"Three more gliding diphthongs. Clean glides keep your speech crisp and native.",
 ex:[
  x("PRICE","'I, my, time, like, five, night' — ah→ee glide. 3 passes.",6),
  x("MOUTH","'now, how, out, down, about, house' — ah→oo glide. 3 passes.",6),
  x("CHOICE","'boy, toy, voice, point, enjoy, noise' — aw→ee glide. 3 passes.",6),
  x("Shadow & record","Shadow 3 min, record all three sets, verify each diphthong moves cleanly.",7),
 ],
 listen:"Track diphthongs in your model — they are quick but always complete."},

{p:2,title:"Vowel Consolidation + Minimal Pairs",
 why:"End of week 2. Stress-test your whole vowel system under pressure.",
 ex:[
  x("Vowel sweep review","Run the heed–hid–...–who'd sweep, plus TRAP, LOT-THOUGHT, all diphthongs. 3 minutes.",8),
  x("Minimal pair gauntlet","sheep/ship, cot/caught, bat/bet, full/fool, cap/cup. 5 reps each pair, fast.",7),
  x("Vowel-rich passage","Read the Rainbow Passage again — this time focus only on vowel quality.",7),
  x("Re-record & log","Record the passage, compare to Day 1 and Day 7. Log a tracker session.",6),
 ],
 listen:"Compare your three recordings so far. Vowels should be noticeably more American."},

/* ---------- PHASE 3 ---------- */
{p:3,title:"The Flap T",
 why:"'water' sounds like 'wadder' in American English. The flap T is everywhere and instantly American.",
 ex:[
  x("Make the flap","A T or D between vowels becomes a quick tongue tap — like a fast 'd'. Say 'water' as 'wadder'.",6),
  x("Flap-T word set","water, better, city, letter, butter, party, little, matter, pretty, daughter. 3 passes.",8),
  x("Flap across words","'get it', 'put it on', 'a lot of' → 'gerit', 'purit on', 'a lodda'. The flap crosses word boundaries.",8),
  x("Shadow & record","Shadow 3 min, record the set + phrases, confirm every medial T flaps.",6),
 ],
 listen:"Count flap-T words in 1 minute of your model — there will be many."},

{p:3,title:"The Glottal T",
 why:"In 'button' and 'mountain' the T becomes a glottal stop. Knowing when to flap vs glottalize is key.",
 ex:[
  x("Make the glottal stop","Close your throat briefly — the catch in 'uh-oh'. That replaces the T in 'button'.",5),
  x("Glottal-T word set","button, mountain, kitten, cotton, certain, important, fountain, written. T → throat catch + N.",8),
  x("Flap vs glottal sort","Sort 10 words: medial T before a vowel = flap (water); T before syllabic N = glottal (button).",8),
  x("Shadow & record","Shadow 3 min, record both sets, confirm correct choice for each word.",6),
 ],
 listen:"Notice your model never fully releases the T in 'important' or 'mountain'."},

{p:3,title:"Final T & T-Clusters",
 why:"Word-final and clustered T's behave specially in American speech — often held, glottalized, or dropped.",
 ex:[
  x("Held final T","'cat', 'right', 'what' — the T is often unreleased: tongue goes up, no puff of air.",6),
  x("T in clusters","'don't know' → 'dono', 'want to' → 'wanna', 'first time' the first T may vanish.",8),
  x("Sentence drill","'I don't want to', 'what did you get', 'right at the start'. Apply held/dropped/flapped T correctly.",8),
  x("Shadow & record","Shadow 3 min, record the sentences, check natural T behavior.",6),
 ],
 listen:"Listen for how often final T is NOT a crisp released sound in casual American speech."},

{p:3,title:"The Dark L",
 why:"American L is 'dark' (velarized) in most positions — the back of the tongue lifts. This thickens your L.",
 ex:[
  x("Make the dark L","Tip touches the ridge, but lift the BACK of the tongue too. Say 'full' — feel the back lift.",6),
  x("Dark-L word set","ball, milk, feel, cold, help, all, well, real, school, people. 3 passes.",8),
  x("Light vs dark","Initial L can be lighter ('like'); final/coda L is dark ('feel'). Contrast 6 word pairs.",7),
  x("Shadow & record","Shadow 3 min, record the dark-L set, confirm the thicker back-of-tongue quality.",6),
 ],
 listen:"Notice how 'thick' your model's L sounds in 'well', 'all', 'cold'."},

{p:3,title:"TH Sounds & Yod-Dropping",
 why:"Clean TH plus 'yod-dropping' ('Tuesday' = 'Toozday') sharpen your American profile.",
 ex:[
  x("Two TH sounds","Voiced 'this/that/the' vs voiceless 'think/thanks/three'. Tongue tip lightly between teeth.",6),
  x("TH word set","the, this, that, they, think, three, thanks, breathe, mother, with. 3 passes.",6),
  x("Yod-dropping","After t/d/n, Americans drop the 'y': Tuesday→Toozday, news→nooz, student→stoodent, duty→dooty.",8),
  x("Shadow & record","Shadow 3 min, record both sets, confirm clean TH and dropped yods.",6),
 ],
 listen:"Catch 'new', 'Tuesday', 'student' in your model — listen for the missing 'y'."},

{p:3,title:"Linking & Connected Speech",
 why:"Native speech connects words into smooth chunks. Choppy word-by-word speech sounds foreign.",
 ex:[
  x("Consonant-to-vowel linking","'an apple' → 'a-napple', 'pick it up' → 'pi-ki-tup'. Final consonant joins the next vowel.",7),
  x("Linking with R and W/Y","'I am' → 'I-yam', 'go away' → 'go-waway', 'far away' → 'fa-raway'.",7),
  x("Chunked sentences","Read 3 sentences as connected blocks, no gaps between words within a thought group.",8),
  x("Shadow & record","Shadow 3 min, record the sentences, confirm smooth linking.",6),
 ],
 listen:"Notice your model speaks in connected chunks, not separated words."},

{p:3,title:"Consonant Consolidation",
 why:"End of week 3. Integrate flap T, glottal T, dark L and linking into running speech.",
 ex:[
  x("Consonant review","Run flap-T, glottal-T, dark-L, TH and yod sets. 3 minutes.",8),
  x("Connected-speech passage","Read a paragraph applying ALL consonant rules + linking simultaneously.",8),
  x("Re-record baseline","Record the Rainbow Passage. Compare with Days 1, 7, 14.",7),
  x("Progress log","Log a tracker session, rate all six skills.",4),
 ],
 listen:"Your week 3 recording should sound markedly smoother and more connected."},

/* ---------- PHASE 4 ---------- */
{p:4,title:"Word Stress",
 why:"Every multi-syllable word has one strong syllable. Wrong stress is one of the hardest accent tells to hear in yourself.",
 ex:[
  x("Hear the stress","Tap the table on the strong syllable: 'a-MER-i-can', 'PHO-to-graph', 'pho-TOG-ra-phy'.",6),
  x("Stress-shift pairs","Note how stress moves: 'PHOtograph / phoTOGraphy / photoGRAPHic'. Practice 6 such families.",8),
  x("Noun vs verb stress","'REcord (noun) / reCORD (verb)', 'PREsent / preSENT'. Drill 6 pairs.",7),
  x("Shadow & record","Shadow 3 min, record a word list, verify correct stress placement.",6),
 ],
 listen:"When unsure of a word's stress, look it up — do not guess."},

{p:4,title:"Content vs Function Words",
 why:"Americans stress content words (nouns, verbs) and swallow function words (the, of, to). This creates the rhythm.",
 ex:[
  x("Identify the two types","In any sentence, mark CONTENT (carry meaning) vs FUNCTION (grammar glue) words.",6),
  x("Stress only content","'I went TO the STORE to BUY some BREAD' — only caps get stress, rest reduces.",8),
  x("Reduction practice","Read 3 sentences hitting only content words hard, reducing all function words to schwa.",8),
  x("Shadow & record","Shadow 3 min, record the sentences, confirm the strong-weak pattern.",6),
 ],
 listen:"Hear how your model almost throws away function words."},

{p:4,title:"Stress-Timed Rhythm",
 why:"English is stress-timed: stressed syllables fall at regular beats, and everything between gets compressed.",
 ex:[
  x("The beat","Clap a steady beat. Fit each sentence so stressed syllables land ON the claps, regardless of how many weak syllables sit between.",7),
  x("Compression drill","'CATS eat MICE' vs 'the CATS will have EATen the MICE' — both take the same time. Drill 5 such pairs.",8),
  x("Rhythmic reading","Read a paragraph to a metronome at 60 bpm, one stress per beat.",8),
  x("Shadow & record","Shadow 3 min, record the paragraph, check for even stress timing.",6),
 ],
 listen:"Feel the underlying pulse in your model's speech — it is almost musical."},

{p:4,title:"Intonation Contours",
 why:"Pitch movement carries meaning and attitude. Flat or wrongly-shaped intonation sounds non-native or robotic.",
 ex:[
  x("Statement fall","Statements glide DOWN at the end. 'I live in New York.' Exaggerate the final fall 8x.",6),
  x("Yes/no rise vs Wh-fall","'Are you coming?' rises. 'Where are you going?' falls. Drill 6 of each.",8),
  x("List intonation","'red, green, blue, and yellow' — rises on each item, falls on the last.",6),
  x("Shadow & record","Shadow 3 min copying pitch exactly, record 6 sentences, check contours.",7),
 ],
 listen:"Trace the pitch line of your model's sentences with your hand in the air."},

{p:4,title:"Thought Groups & Pausing",
 why:"Native speakers chunk speech into thought groups with deliberate pauses. This adds clarity and a natural feel.",
 ex:[
  x("Mark the chunks","Take a paragraph; mark / where a natural pause belongs. Each chunk is one idea.",6),
  x("One contour per chunk","Each thought group gets its own intonation arc — usually rising mid-sentence, falling at the end.",8),
  x("Paced reading","Read the paragraph honoring every pause. Do not rush through chunk boundaries.",8),
  x("Shadow & record","Shadow 3 min noting where the model pauses, record your paragraph.",6),
 ],
 listen:"Notice your model's pauses are purposeful, not random gasps for air."},

{p:4,title:"Contrastive & Emphatic Stress",
 why:"Americans move stress to the word that carries the key contrast. It signals meaning precisely.",
 ex:[
  x("Shift the focus","'I didn't say HE stole it' vs 'I didn't say he STOLE it' — same words, stress changes meaning. Drill 6.",8),
  x("Emphasis for emotion","Stretch and raise pitch on the emphasized word: 'That was AMAZING.'",6),
  x("Mini-dialogue","Perform a 4-line dialogue, choosing the right contrastive stress in each line.",8),
  x("Shadow & record","Shadow 3 min of expressive speech, record the dialogue.",6),
 ],
 listen:"Hear how your model spotlights one key word per sentence."},

{p:4,title:"Casual Reductions",
 why:"'gonna, wanna, gotta, kinda, lemme' — relaxed forms are not lazy, they are native. Avoiding them sounds stiff.",
 ex:[
  x("Core reductions","gonna (going to), wanna (want to), gotta (got to), kinda (kind of), lemme (let me), gimme (give me).",6),
  x("'Did you / what are you'","'whatcha doing', 'didja see', 'whaddaya want'. Drill 6 reduced question forms.",8),
  x("Reduced conversation","Read a casual dialogue using natural reductions throughout.",8),
  x("Shadow & record","Shadow 3 min of casual speech, record the dialogue, confirm relaxed forms.",6),
 ],
 listen:"Casual American speech is FULL of these — count them in 1 minute of relaxed talk."},

{p:4,title:"Integration Monologue",
 why:"Drills work in isolation. Today you fuse everything into continuous, self-generated speech.",
 ex:[
  x("Full warm-up","R sustain, vowel sweep, flap-T set, intonation glides. 5 minutes.",5),
  x("Plan a 2-minute talk","Pick a topic you know well. Outline 4 points. You will speak, not read.",6),
  x("Deliver the monologue","Record yourself speaking for 2 minutes, applying every skill consciously.",8),
  x("Self-review","Listen back. Note 2 things that improved and 2 weak spots for the next phase.",6),
 ],
 listen:"Self-generated speech is harder than reading — that gap is your real progress target."},

{p:4,title:"30-Day Milestone Assessment",
 why:"Halfway point. Measure hard, celebrate honestly, and set the focus for phase 5.",
 ex:[
  x("Full re-record","Record the Rainbow Passage AND your 2-minute monologue.",8),
  x("Day 1 vs Day 30","Listen to Day 1 and today back to back. Write down every audible improvement.",7),
  x("Score yourself","Rate all six skills 1–10. Be specific about your weakest two — they drive phase 5.",6),
  x("Log the milestone","Save a full tracker session. Take a moment — you are halfway to the goal.",4),
 ],
 listen:"This comparison is the most motivating thing you will do. Do not skip it."},

/* ---------- PHASE 5 : 31-60 ---------- */
{p:5,title:"Conversational Shadowing",
 why:"Phase 5 shifts from drills to real speech. Start by shadowing natural dialogue, not scripted reading.",
 ex:[
  x("Warm-up","3-min full warm-up: R, vowels, flap-T, intonation.",3),
  x("Close shadowing","Shadow 5 minutes of conversational content (podcast/interview), staying within 1 second of the speaker.",8),
  x("Echo shadowing","Replay 5 short lines; reproduce each from memory with identical melody.",8),
  x("Record & compare","Record one shadowed minute, compare side-by-side with the original.",6),
 ],
 listen:"Conversational speech is faster and messier than scripted — match its texture."},

{p:5,title:"Self-Talk Narration",
 why:"Narrating your own actions builds spontaneous fluency with zero translation lag.",
 ex:[
  x("Warm-up","3-min warm-up.",3),
  x("Narrate your morning","Out loud, describe what you are doing as you do it, in American accent, for 5 minutes.",7),
  x("Describe a photo","Pick any photo; describe it in detail for 2 minutes without stopping.",7),
  x("Record & flag","Record 2 minutes of free narration, flag the 3 weakest sounds.",6),
 ],
 listen:"Notice which sounds collapse when you stop concentrating — those are your real targets."},

{p:5,title:"The Phone Voice",
 why:"Phone audio strips visual cues, so pronunciation alone must carry. Great training pressure.",
 ex:[
  x("Warm-up","3-min warm-up.",3),
  x("Voicemail drill","Record a 45-second 'voicemail' three times, improving clarity and rhythm each take.",7),
  x("Numbers & spelling","Say phone numbers, dates and spell names aloud — clarity under American intonation.",7),
  x("Mock call","Improvise a 3-minute phone conversation, both sides, switching naturally.",7),
 ],
 listen:"Phone speech is slightly clearer and more deliberate — but still rhythmic."},

{p:5,title:"Dialogue Role-Play",
 why:"Switching between speakers trains flexible intonation and quick reset of mouth posture.",
 ex:[
  x("Warm-up","3-min warm-up.",3),
  x("Two-voice scene","Perform a short dialogue playing BOTH characters with distinct but American delivery.",8),
  x("Reaction lines","Drill quick reactions: 'No way!', 'Are you serious?', 'That's awesome.' — full melody.",6),
  x("Record the scene","Record the full dialogue, check that each line lands naturally.",7),
 ],
 listen:"Conversational reactions carry strong, fast intonation — copy that energy."},

{p:5,title:"Question Intonation in Conversation",
 why:"Real conversation is full of questions. Their melody must be automatic, not calculated.",
 ex:[
  x("Warm-up","3-min warm-up.",3),
  x("Question marathon","Ask 20 varied questions aloud — yes/no, wh-, tag, echo — each with correct contour.",8),
  x("Uptalk awareness","Practice mild statement-uptalk where natural, but keep most statements falling.",6),
  x("Record interview","Record yourself asking and answering 6 interview questions.",7),
 ],
 listen:"Notice the variety of question melodies in a real interview."},

{p:5,title:"Listening Discrimination Day",
 why:"You can only produce what you can hear. Sharpening perception accelerates production.",
 ex:[
  x("Minimal-pair listening","Have a tool/app play minimal pairs; identify which you heard. 20 rounds.",7),
  x("Transcribe a clip","Transcribe 60 seconds of fast speech exactly, including reductions ('wanna', 'gonna').",9),
  x("Shadow the same clip","Shadow the clip you transcribed, now that you know every word.",7),
  x("Note blind spots","Write the contrasts you struggle to HEAR — they need extra production drilling.",4),
 ],
 listen:"Perception gaps cause production gaps. Find yours today."},

{p:5,title:"Week 5 Review + Record",
 why:"Checkpoint. Confirm conversational skills are consolidating.",
 ex:[

let _db=null, _mem={}, _idbOk=true;

function idbOpen(){
  return new Promise((res,rej)=>{
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VER); }catch(e){ return rej(e); }
    req.onupgradeneeded=()=>{ const db=req.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbReady(){
  if(_db) return _db;
  if(!_idbOk) return null;
  try{ _db=await idbOpen(); }catch(e){ _idbOk=false; _db=null; }
  return _db;
}
function idbDo(store,mode,fn){
  return new Promise(async (res,rej)=>{
    const db=await idbReady();
    if(!db) return rej(new Error('no-idb'));
    let out;
    const tx=db.transaction(store,mode); const st=tx.objectStore(store);
    const r=fn(st); if(r) r.onsuccess=()=>{ out=r.result; };
    tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error);
  });
}
async function kvGet(k){ try{ return await idbDo('kv','readonly',st=>st.get(k)); }catch(e){ return _mem[k]; } }
async function kvSet(k,v){ try{ await idbDo('kv','readwrite',st=>st.put(v,k)); }catch(e){ _mem[k]=v; } }
async function audioPut(id,blob){ try{ await idbDo('audio','readwrite',st=>st.put(blob,id)); }catch(e){ _mem['a:'+id]=blob; } }
async function audioGet(id){
  let b;
  try{ b=await idbDo('audio','readonly',st=>st.get(id)); }catch(e){}
  if(!b) b=_mem['a:'+id];
  if(b) return b;
  // local miss: pull from cloud, then cache locally for next time
  const cloud=await cloudDownloadAudio(id);
  if(cloud){ try{ await audioPut(id, cloud); }catch(e){} }
  return cloud||null;
}
async function audioDel(id){ try{ await idbDo('audio','readwrite',st=>st.delete(id)); }catch(e){} delete _mem['a:'+id]; }
async function audioClear(){ try{ await idbDo('audio','readwrite',st=>st.clear()); }catch(e){} _mem={}; }

const SCHEMA_VERSION = 1;
/* Normalize any state (local or cloud) up to the current shape.
   Today this only stamps the version; add a migration rung whenever
   the STATE shape changes so old rows upgrade instead of corrupting. */
function migrateState(s){
  if(!s || typeof s!=='object') return s;
  if(!Array.isArray(s.deletedRecordings)) s.deletedRecordings=[];
  // const v = s.schemaVersion || 0;
  // if(v < 2){ /* reshape fields here */ s.schemaVersion = 2; }
  s.schemaVersion = Math.max(s.schemaVersion||0, SCHEMA_VERSION);  // only ever stamp forward
  return s;
}

let STATE={ startDate:null, completed:{}, logs:[], viewDay:1, recordings:[], deletedRecordings:[], weakSpots:[],
  baseline:null, earned:[], targetScore:85, schemaVersion:SCHEMA_VERSION };

async function loadState(){
  try{ const s=await kvGet(STATE_KEY); if(s&&typeof s==='object') STATE=Object.assign(STATE,s); }catch(e){}
  STATE=migrateState(STATE);
  if(STATE.updatedAt) _seeded=true;   // a real prior save existed -> not pristine
  if(!Array.isArray(STATE.recordings)) STATE.recordings=[];
  if(!Array.isArray(STATE.weakSpots)) STATE.weakSpots=[];
  if(!Array.isArray(STATE.logs)) STATE.logs=[];
  if(!Array.isArray(STATE.earned)) STATE.earned=[];
  if(!STATE.completed) STATE.completed={};
  if(typeof STATE.targetScore!=='number') STATE.targetScore=85;
  // do NOT set startDate or save here; defer to after cloudPull (see BOOT) to avoid clobbering cloud
}
let saveTimer=null;
let _suppressPush = false;
let _seeded = false;     // true once local STATE holds real data (genuine save, or adopted from cloud)
let _pulling = false;    // re-entrancy guard so concurrent cloudPull() calls don't interleave
let _cloudSeen = 0;      // server modified timestamp of the last row we read/wrote; replaces client-clock LWW
async function saveState(){
  _seeded = true;                     // a genuine save means we hold real data
  STATE.updatedAt = Date.now();
  try{ await kvSet(STATE_KEY,STATE); }catch(e){ console.error('save failed',e); }
  cloudQueuePush();
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveState,400); }

/* ---------------- CLOUD SYNC (state) ---------------- */
/* Recordings are a set, not a scalar: two devices can each add a clip between
   syncs, so a whole-array LWW replace silently drops whichever device pushed
   second-to-last. These three helpers turn every pull into a union merge
   instead of a replace. Deletes ride along as tombstones so a merge can't
   resurrect something one device already removed. */
function mergeTombstones(a,b){
  const m=new Map();
  for(const t of [...(a||[]),...(b||[])]) if(t&&t.id) m.set(t.id,t);
  return [...m.values()];
}
function mergeRecordings(localRecs, cloudRecs, tombs){
  const dead=new Set((tombs||[]).map(t=>t.id));
  const byId=new Map();
  const signal=x=>(x.benchmark?2:0)+(x.feedback?1:0);
  for(const r of [...(cloudRecs||[]), ...(localRecs||[])]){   // local last: local field edit wins a tie
    if(!r||!r.id||dead.has(r.id)) continue;
    const prev=byId.get(r.id);
    if(!prev){ byId.set(r.id,r); continue; }
    if(signal(r)>signal(prev)) byId.set(r.id,r);
    else if(signal(r)===signal(prev) && (r.ts||0)>=(prev.ts||0)) byId.set(r.id,r);
  }
  return [...byId.values()].sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function sameIds(a,b){
  const s=x=>[...new Set((x||[]).map(r=>r.id))].sort().join(',');
  return s(a)===s(b);
}

let _cloudTimer=null;
function cloudQueuePush(){
  if(_suppressPush) return;
  clearTimeout(_cloudTimer);
  _cloudTimer=setTimeout(cloudPush, 800);
}
async function cloudUser(){ return (await sb.auth.getUser()).data.user; }

async function cloudPush(){
  const u=await cloudUser(); if(!u) return;
  if(!_seeded) return;                 // never push pristine/unreconciled defaults over the cloud
  try{
    const { data } = await sb.from('app_state').upsert({
      user_id:u.id, state:STATE,
      updated_at:STATE.updatedAt||Date.now(), device:_deviceId
    }).select('modified').maybeSingle();
    if(data && data.modified) _cloudSeen = Date.parse(data.modified); // record server time we just wrote
  }catch(e){ console.warn('cloud push failed', e); }
}

async function cloudPull(){
  if(_pulling) return; _pulling=true;
  try{
    const u=await cloudUser(); if(!u) return;
    const { data, error } = await sb
      .from('app_state').select('state,updated_at,modified')  // now also fetches server timestamp
      .eq('user_id',u.id).maybeSingle();
    if(error){ console.warn('cloud pull failed', error); return; }

    if(!data){                                       // no cloud row yet for this account
      if(_seeded){ await cloudPush(); }              //   real local data -> seed cloud with it
      else {                                         //   pristine first device -> create the real seed
        if(!STATE.startDate) STATE.startDate=todayStr();
        _seeded=true;
        await saveState();                           //   stamps updatedAt and pushes (now allowed)
        render();
      }
      return;
    }

    const serverMod   = data.modified ? Date.parse(data.modified) : 0;
    const cloudVer    = (data.state && data.state.schemaVersion)||0;

    // Server-clock LWW: compare _cloudSeen (the server time of the last row we touched) against
    // the current server modified timestamp. This eliminates client-clock skew entirely.
    // Also always adopt if local is pristine/unseeded, or cloud carries a newer schema version.
    const cloudIsNewer = serverMod > _cloudSeen;
    const adoptScalars = (!_seeded || cloudVer > SCHEMA_VERSION || cloudIsNewer);

    // Recordings + tombstones ALWAYS union, independent of scalar LWW, so neither
    // device's array can clobber the other's (this is the fix for the AUD-2 bug:
    // whichever device pushed last was silently deleting the other's clips).
    const cloudRecs = (data.state && data.state.recordings) || [];
    const tombs     = mergeTombstones(STATE.deletedRecordings, data.state && data.state.deletedRecordings);
    const mergedRecs= mergeRecordings(STATE.recordings, cloudRecs, tombs);
    const cloudMissingSome = !sameIds(cloudRecs, mergedRecs)
      || !sameIds((data.state && data.state.deletedRecordings)||[], tombs);

    _suppressPush=true;
    if(adoptScalars){
      STATE=migrateState(Object.assign(STATE, data.state));   // scalars by server-clock LWW, unchanged
      _cloudSeen = serverMod;
    }
    STATE.recordings        = mergedRecs;                      // union, always
    STATE.deletedRecordings = tombs;                            // union, always
    _seeded=true;
    try{ await kvSet(STATE_KEY, STATE); }catch(e){}
    _suppressPush=false;

    render();
    if(adoptScalars) toast && toast('Synced from the cloud.');
    // push back whenever we hold recordings/tombstones the cloud row lacks, or
    // (prior behavior, unchanged) when we're ahead on everything else
    if(cloudMissingSome || (!adoptScalars && _seeded)) await cloudPush();
  } finally { _pulling=false; }
}

}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysSinceStart(){
  const a=new Date(STATE.startDate+'T00:00:00'), b=new Date(todayStr()+'T00:00:00');
  return Math.floor((b-a)/86400000);
}
function suggestedDay(){ return Math.min(60,Math.max(1,daysSinceStart()+1)); }
function dayCompletion(d){

  const done=arr.filter(Boolean).length;
  return {done,total,pct:total?Math.round(done/total*100):0,full:done===total&&total>0};
}
function fullyDoneCount(){ let n=0; for(let d=1;d<=60;d++){ if(dayCompletion(d).full) n++; } return n; }
function totalMinutes(){ return STATE.logs.reduce((s,l)=>s+(+l.minutes||0),0); }

  if(!dates.has(todayStr())) cur.setDate(cur.getDate()-1);
  while(dates.has(cur.toISOString().slice(0,10))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}
function avgRatings(){

  });

}

/* ============================================================
   PERSONALIZATION + WEIGHTED ACCENT SCORE
   ============================================================ */
/* Base impact weights: how much each skill matters to sounding American. */
const BASE_WEIGHTS={ r:1.2, vowels:1.15, t:1.0, rhythm:1.3, intonation:1.15, fluency:0.9 };

/* Personalized weights: amplify the user's weakest skills (from baseline) so
   improving real weaknesses moves the score the most. */
function personalWeights(){
  const w=Object.assign({},BASE_WEIGHTS);
  const base=STATE.baseline&&STATE.baseline.scores;
  if(base){
    // rank skills by baseline score ascending; boost the lowest two.
    const ranked=SKILLS.map(s=>({k:s.k,v:+base[s.k]||0})).sort((a,b)=>a.v-b.v);
    if(ranked[0]) w[ranked[0].k]*=1.4;
    if(ranked[1]) w[ranked[1].k]*=1.2;
  }
  return w;
}
/* Weighted Accent Score 0-100 from a {scores} object (each 0-10). */
function accentScore(scores){
  if(!scores) return null;
  const w=personalWeights();
  let num=0,den=0;
  SKILLS.forEach(s=>{ const v=+scores[s.k]; if(Number.isFinite(v)){ num+=v*w[s.k]; den+=w[s.k]; } });
  if(!den) return null;
  return Math.round((num/den)*10);
}
/* The latest real (AI) scores we have, preferring AI assessments over self-ratings. */
function latestAIScores(){
  const withFb=STATE.recordings.filter(r=>r.feedback&&r.feedback.scores).sort((a,b)=>(a.feedback.ts||0)-(b.feedback.ts||0));
  if(withFb.length) return withFb[withFb.length-1].feedback.scores;
  return null;
}
/* Time-ordered score history (AI assessments) for trend charts. */
function scoreHistory(){
  return STATE.recordings.filter(r=>r.feedback&&r.feedback.scores)
    .map(r=>({date:r.date, ts:r.feedback.ts||r.ts, scores:r.feedback.scores,
      overall:accentScore(r.feedback.scores), day:r.day}))
    .sort((a,b)=>a.ts-b.ts);
}
function currentAccentScore(){ return accentScore(latestAIScores()); }
function baselineAccentScore(){ return STATE.baseline?accentScore(STATE.baseline.scores):null; }
/* Capture a baseline the first time we get AI scores (or via Set baseline). */
function maybeCaptureBaseline(rec){
  if(STATE.baseline) return;
  if(rec&&rec.feedback&&rec.feedback.scores){
    STATE.baseline={ scores:Object.assign({},rec.feedback.scores), date:rec.date, day:rec.day, fromRec:rec.id };
  }
}
function skillDelta(k){
  const base=STATE.baseline&&STATE.baseline.scores, cur=latestAIScores();
  if(!base||!cur) return null;
  const d=(+cur[k]||0)-(+base[k]||0);
  return d;
}

/* ============================================================
   GAMIFICATION: XP, LEVELS, ACHIEVEMENTS
   ============================================================ */
const LEVELS=[
  {name:'Foundation', min:0},
  {name:'Shaping', min:300},
  {name:'Flowing', min:800},
  {name:'Fluent', min:1600},
  {name:'Near-Native', min:2800},
  {name:'Studio Master', min:4500},
];
/* XP is DERIVED from genuine progress, never from button-mashing.
   This keeps incentives honest and Gemini calls low. */
function computeXP(){
  let xp=0;
  // 20 XP per fully completed day
  xp += fullyDoneCount()*20;
  // 4 XP per individual exercise checked (partial-day credit)
  let exDone=0; for(let d=1;d<=60;d++){ exDone+=(STATE.completed[d]||[]).filter(Boolean).length; }
  xp += exDone*4;
  // 15 XP per logged practice session
  xp += STATE.logs.length*15;
  // 40 XP per mastered drill
  xp += masteredSpots().length*40;
  // 25 XP per benchmark recording that has AI feedback (one per recording, capped)
  xp += STATE.recordings.filter(r=>r.benchmark&&r.feedback).length*25;
  // 30 XP per practice-streak day (rewards consistency)
  xp += streak()*30;
  // Progress bonus: 10 XP per point of Accent-Score improvement over baseline
  const base=baselineAccentScore(), cur=currentAccentScore();
  if(base!=null&&cur!=null&&cur>base) xp += (cur-base)*10;
  return Math.round(xp);
}
function levelFor(xp){
  let lv=LEVELS[0], idx=0;
  for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].min){ lv=LEVELS[i]; idx=i; } }
  const next=LEVELS[idx+1]||null;
  const floor=lv.min, ceil=next?next.min:lv.min;
  const pct=next?Math.round((xp-floor)/(ceil-floor)*100):100;
  return {level:lv, idx, next, pct, xp};
}

  {id:'improve15', icon:'🚀', label:'Transformed', desc:'Raise your Accent Score 15+ points over baseline.',
   test:()=>{const b=baselineAccentScore(),c=currentAccentScore();return b!=null&&c!=null&&(c-b)>=15;}},
  {id:'score75', icon:'⭐', label:'Solid speaker', desc:'Reach an Accent Score of 75.',
   test:()=>{const c=currentAccentScore();return c!=null&&c>=75;}},
  {id:'finish', icon:'👑', label:'Studio graduate', desc:'Complete all 60 days.',

function bestStreak(){
  const dates=[...new Set(STATE.logs.map(l=>l.date))].sort();
  let best=0,run=0,prev=null;
  dates.forEach(ds=>{
    if(prev && (new Date(ds)-new Date(prev))===86400000) run++; else run=1;
    if(run>best) best=run; prev=ds;
  });
  return best;
}
function earnedAchievements(){ return ACHIEVEMENTS.filter(a=>{ try{return a.test();}catch(e){return false;} }); }

function fmtDur(s){ s=Math.max(0,Math.round(s||0)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============================================================
   RECORDER
   ============================================================ */
const Rec={mediaRecorder:null,chunks:[],stream:null,startTs:0,timer:null,active:false,
  pendingBlob:null,pendingUrl:null,pendingDur:0,mime:''};

function pickMime(){
  if(!window.MediaRecorder) return '';
  const opts=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const o of opts){ try{ if(MediaRecorder.isTypeSupported(o)) return o; }catch(e){} }
  return '';
}
async function recStart(){
  if(Rec.active) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Recording needs a modern browser served over HTTPS.'); return;
  }
  try{ Rec.stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('Microphone access was blocked.'); return; }
  const mime=pickMime();
  try{ Rec.mediaRecorder=mime?new MediaRecorder(Rec.stream,{mimeType:mime}):new MediaRecorder(Rec.stream); }
  catch(e){ try{ Rec.mediaRecorder=new MediaRecorder(Rec.stream); }catch(e2){ toast('Recording not supported here.'); return; } }
  Rec.chunks=[]; Rec.mime=Rec.mediaRecorder.mimeType||mime||'audio/webm';
  Rec.mediaRecorder.ondataavailable=e=>{ if(e.data&&e.data.size) Rec.chunks.push(e.data); };
  Rec.mediaRecorder.onstop=()=>{
    const blob=new Blob(Rec.chunks,{type:Rec.mime});
    Rec.pendingBlob=blob;
    Rec.pendingDur=Math.round((Date.now()-Rec.startTs)/1000);
    if(Rec.pendingUrl) URL.revokeObjectURL(Rec.pendingUrl);
    Rec.pendingUrl=URL.createObjectURL(blob);
    Rec.active=false; clearInterval(Rec.timer);
    (Rec.stream?Rec.stream.getTracks():[]).forEach(t=>t.stop());
    renderRecorder();
  };
  Rec.startTs=Date.now(); Rec.active=true;
  try{ Rec.mediaRecorder.start(); }catch(e){ Rec.active=false; toast('Could not start recording.'); return; }
  Rec.timer=setInterval(()=>{
    const el=document.getElementById('recTimer');
    if(el) el.textContent=fmtDur((Date.now()-Rec.startTs)/1000);
  },250);
  renderRecorder();
}
function recStop(){ if(Rec.mediaRecorder&&Rec.active){ try{ Rec.mediaRecorder.stop(); }catch(e){} } }
function discardPending(){
  if(Rec.pendingUrl) URL.revokeObjectURL(Rec.pendingUrl);
  Rec.pendingBlob=null; Rec.pendingUrl=null; Rec.pendingDur=0;
}
async function saveRecording(){
  if(!Rec.pendingBlob) return;
  const d=STATE.viewDay||suggestedDay();
  const labelEl=document.getElementById('recLabel');
  const benchEl=document.getElementById('recBench');
  const label=(labelEl&&labelEl.value.trim())||autoLabel(d);
  const id='rec_'+Date.now();
  await audioPut(id,Rec.pendingBlob);
  cloudUploadAudio(id, Rec.pendingBlob);   // phase 2: fire-and-forget cloud upload
  STATE.recordings.push({id,day:d,date:todayStr(),label,
    benchmark:!!(benchEl&&benchEl.checked),duration:Rec.pendingDur||0,
    mime:Rec.mime,ts:Date.now()});
  await saveState();
  discardPending();
  toast('Recording saved to your library.');
  renderRecorder();
}
async function deleteRecording(id){
  const r=STATE.recordings.find(x=>x.id===id);
  if(!confirm('Delete this recording? "'+(r?r.label:'')+'"')) return;
  await audioDel(id);
  cloudDeleteAudio(id);   // phase 2: also remove from cloud
  STATE.recordings=STATE.recordings.filter(x=>x.id!==id);
  (STATE.deletedRecordings=STATE.deletedRecordings||[]).push({id,ts:Date.now()});
  await saveState();
  render();
}
async function playRec(id){
  const row=document.querySelector('[data-rid="'+id+'"]');
  if(!row) return;
  let pl=row.querySelector('audio.inline-pl');
  if(pl){ pl.play(); return; }
  const blob=await audioGet(id);
  if(!blob){ toast('Audio data not found for this entry.'); return; }
  pl=document.createElement('audio');
  pl.className='inline-pl'; pl.controls=true; pl.autoplay=true;
  pl.src=URL.createObjectURL(blob);
  row.appendChild(pl);
}

function drawRadar(av){
  const cx=140,cy=140,R=104,n=SKILLS.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{
    rings+=`<polygon points="${SKILLS.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#3a3128" stroke-width="1"/>`;
  });
  let axes='',labels='';
  SKILLS.forEach((s,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3128" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+22);
    labels+=`<text x="${lx}" y="${ly}" fill="#8a7f6d" font-size="10.5" font-family="JetBrains Mono,monospace"
      text-anchor="middle" dominant-baseline="middle">${s.label.split(' ')[0]}</text>`;
  });
  let shape='',dots='';
  if(av){
    const pts=SKILLS.map((s,i)=>pt(i,R*(av[s.k]/10)));
    shape=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(233,162,59,.22)" stroke="#e9a23b" stroke-width="2"/>`;
    dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${SKILLS[i].color}"/>`).join('');
  }
  const legend=SKILLS.map(s=>{
    const v=av?av[s.k]:0;
    return `<div class="row"><span class="dot" style="background:${s.color}"></span>
      <span style="flex:1">${s.label}</span>
      <span class="bar-track" style="max-width:90px"><span class="bar-fill" style="width:${v*10}%;background:${s.color}"></span></span>
      <span class="val">${av?v.toFixed(1):'—'}</span></div>`;
  }).join('');
  return `<div class="radar-flex">
    <svg width="280" height="280" viewBox="0 0 280 280">${rings}${axes}${shape}${dots}${labels}</svg>
    <div class="legend">${legend}
      ${!av?'<div style="color:var(--ink-faint);font-style:italic;font-size:13px;margin-top:8px">Log your first practice session to build your skill profile.</div>':''}
    </div></div>`;
}
function drawHeat(){
  const mins={}; STATE.logs.forEach(l=>{ mins[l.date]=(mins[l.date]||0)+(+l.minutes||0); });
  let cells=''; const today=todayStr();
  for(let i=62;i>=0;i--){
    const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10); const m=mins[ds]||0;
    let cls='cell';
    if(m>0&&m<20)cls+=' l1'; else if(m>=20&&m<40)cls+=' l2'; else if(m>=40)cls+=' l3';
    if(ds===today)cls+=' today';
    cells+=`<div class="${cls}" title="${ds}: ${m} min"></div>`;
  }
  return `<div class="heat">${cells}</div>
    <div class="heat-key"><span>Less</span><span class="cell"></span><span class="cell l1"></span>
      <span class="cell l2"></span><span class="cell l3"></span><span>More</span></div>`;
}

/* ============================================================
   AI FEEDBACK (Gemini via /api/feedback serverless function)
   ============================================================ */
const AI={ endpoint:'/api/feedback', maxSeconds:90 };
/* Public-domain reference text used on benchmark days so the model can compare. */
const RAINBOW="When the sunlight strikes raindrops in the air, they act as a prism and form a rainbow. The rainbow is a division of white light into many beautiful colors. These take the shape of a long round arch, with its path high above, and its two ends apparently beyond the horizon.";

function abToB64(buf){
  let bin=''; const bytes=new Uint8Array(buf); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function encodeWav(samples,rate){
  const buf=new ArrayBuffer(44+samples.length*2), view=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); view.setUint32(4,36+samples.length*2,true); w(8,'WAVE');
  w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,rate,true); view.setUint32(28,rate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  w(36,'data'); view.setUint32(40,samples.length*2,true);
  let o=44; for(let i=0;i<samples.length;i++){ let s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return buf;
}
async function blobToWavB64(blob,targetRate){
  targetRate=targetRate||16000;
  const arr=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) throw new Error('no-audio-context');
  const ctx=new AC();
  let decoded;
  try{ decoded=await ctx.decodeAudioData(arr.slice(0)); }
  catch(e){ ctx.close&&ctx.close(); throw new Error('decode-failed'); }
  const len=decoded.length, chans=decoded.numberOfChannels;
  const mono=new Float32Array(len);
  for(let c=0;c<chans;c++){ const d=decoded.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/chans; }
  const ratio=decoded.sampleRate/targetRate;
  let outLen=Math.floor(len/ratio);
  const maxSamples=AI.maxSeconds*targetRate;
  if(outLen>maxSamples) outLen=maxSamples; // cap length to stay under request limits
  const out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++) out[i]=mono[Math.floor(i*ratio)]||0;
  ctx.close&&ctx.close();
  return abToB64(encodeWav(out,targetRate));
}

async function aiFeedback(recId){
  const rec=STATE.recordings.find(r=>r.id===recId);
  if(!rec) return;
  if(rec.feedback){ showFeedbackModal(rec); return; }
  showFeedbackLoading();
  let blob;
  try{ blob=await audioGet(recId); }catch(e){}
  if(!blob){ showFeedbackError('The audio for this recording could not be found.'); return; }
  let wavB64;
  try{ wavB64=await blobToWavB64(blob); }
  catch(e){ showFeedbackError('This recording could not be processed in your browser. Try a recording made in this same browser.'); return; }
  const day=PLAN[rec.day-1];
  const referenceText = rec.benchmark?RAINBOW:'';

  // On benchmark days, first get objective phoneme scores from Azure (if configured),
  // then feed them into the AI coach so its advice is grounded in hard numbers.
  let azure=null;
  if(referenceText){
    try{
      const sc=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({audioBase64:wavB64, referenceText})});
      if(sc.ok){ const sj=await sc.json(); if(sj&&sj.ok) azure=sj; }
      // a 404/500 just means Azure isn't set up yet; we silently fall back to AI-only.
    }catch(e){ /* Azure optional; ignore and continue with AI-only */ }
  }

  const payload={
    audioBase64:wavB64, mimeType:'audio/wav',
    day:rec.day, title:day?day.title:('Day '+rec.day),
    referenceText,
    focus: day?day.title:'',
    weakSpots: activeSpots().map(s=>s.label).slice(0,6),
    azure
  };
  let res,data;
  try{ res=await fetch(AI.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
  catch(e){ showFeedbackError('Could not reach the feedback service. If you are viewing this as a local file, deploy to Vercel first — the AI function only runs when hosted.'); return; }
  if(!res.ok){
    let msg='The feedback service returned an error ('+res.status+').';
    try{ const j=await res.json(); if(j&&j.error) msg=j.error; }catch(e){}
    if(res.status===404) msg='Feedback function not found. Make sure the /api/feedback file is deployed and you have set the GEMINI_API_KEY environment variable in Vercel.';
    if(res.status===413) msg='That recording is too long to analyze. Keep takes under about 90 seconds. For benchmark days, reading the passage once at a natural pace is plenty.';
    showFeedbackError(msg); return;
  }
  try{ data=await res.json(); }
  catch(e){ showFeedbackError('The feedback service sent a response that could not be read.'); return; }
  if(!data||!data.scores){ showFeedbackError('The model did not return a usable assessment. Try again.'); return; }
  rec.feedback={...data, at:todayStr(), ts:Date.now()};
  maybeCaptureBaseline(rec);
  const fresh=syncAchievements();
  await saveState();
  showFeedbackModal(rec);
  render();
  celebrate(fresh);
}

async function loadCompare(slot,id){
  const a=document.getElementById('cmpAudio'+slot);
  if(!a) return;
  if(a.dataset.url){ URL.revokeObjectURL(a.dataset.url); a.dataset.url=''; }
  if(!id){ a.removeAttribute('src'); return; }
  const blob=await audioGet(id);
  if(!blob) return;
  const url=URL.createObjectURL(blob); a.dataset.url=url; a.src=url;
}
function initCompare(){
  const recs=[...STATE.recordings].sort((a,b)=>a.ts-b.ts);
  if(!recs.length) return;
  const selA=document.getElementById('cmpSelA'), selB=document.getElementById('cmpSelB');
  if(!selA||!selB) return;
  selA.value=recs[0].id;
  selB.value=recs[recs.length-1].id;
  loadCompare('A',selA.value); loadCompare('B',selB.value);
  selA.onchange=()=>loadCompare('A',selA.value);
  selB.onchange=()=>loadCompare('B',selB.value);
}

function drillCardHtml(s){
  const total=SR_INTERVALS.length+1;
  let dots='';
  const filled=s.mastered?total:s.reps;
  for(let i=0;i<total;i++) dots+=`<span class="sr-dot ${i<filled?'on':''}"></span>`;
  const cls='drill-card '+(s.mastered?'mastered':(spotDue(s)?'due':''));
  const hasPack=(typeof getDrillPack==='function')&&getDrillPack(s.label);
  const practiceBtn=hasPack?`<button class="btn primary mini" data-openpack="${s.id}">🎧 Practice</button> `:'';
  let actions='';
  if(s.mastered){
    actions=`<button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  } else if(spotDue(s)){
    actions=`${practiceBtn}<button class="btn ${hasPack?'ghost':'primary'} mini" data-practiced="${s.id}">✓ Practiced</button>
      <button class="btn ghost mini" data-snooze="${s.id}">Snooze 1d</button>
      <button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  } else {
    actions=`${practiceBtn}<button class="btn ghost mini" data-practiced="${s.id}">Practice now</button>
      <button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  }
  const dueTxt=s.mastered?'Mastered':(spotDue(s)?'Due today':'Next review: '+s.dueDate);
  return `<div class="${cls}" data-spot="${s.id}">
    <div class="drill-top">
      <div class="drill-label">${escapeHtml(s.label)}</div>
      <div class="sr-dots" title="${filled} of ${total}">${dots}</div>
    </div>
    ${s.note?`<div class="drill-note">${escapeHtml(s.note)}</div>`:''}
    <div class="drill-foot">
      <span class="drill-due">${dueTxt}</span>
      <div class="drill-actions">${actions}</div>
    </div>
  </div>`;
}
function addSpot(){
  const sel=(document.getElementById('spotSel')||{}).value||'';
  const custom=((document.getElementById('spotCustom')||{}).value||'').trim();
  const note=((document.getElementById('spotNote')||{}).value||'').trim();
  const label=custom||sel;
  if(!label){ toast('Choose a common weak spot or type your own.'); return; }
  STATE.weakSpots.push({id:'ws_'+Date.now(),label,note,reps:0,
    created:todayStr(),dueDate:todayStr(),history:[],mastered:false});
  saveState(); render();
  toast('Added — "'+label+'" is due today.');
}
function practiceSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id); if(!s||s.mastered) return;
  s.history=s.history||[]; s.history.push(todayStr());
  if(s.reps<SR_INTERVALS.length){
    s.dueDate=addDays(todayStr(),SR_INTERVALS[s.reps]);
    s.reps++;
  }
  if(s.reps>=SR_INTERVALS.length){ s.mastered=true; }
  saveState(); render();
  toast(s.mastered?'"'+s.label+'" mastered — nicely done.':'Logged. Next review '+s.dueDate+'.');
}
function snoozeSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id); if(!s) return;
  s.dueDate=addDays(todayStr(),1); saveState(); render();
  toast('Snoozed to tomorrow.');
}
function removeSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id);
  if(!confirm('Remove the drill "'+(s?s.label:'')+'"?')) return;
  STATE.weakSpots=STATE.weakSpots.filter(w=>w.id!==id);
  saveState(); render();
}

function viewPlan(){
  const sug=suggestedDay();
  let html='<div class="view show">';
  PHASES.forEach(ph=>{
    const [a,b]=ph.range; let pdone=0;
    for(let d=a;d<=b;d++) if(dayCompletion(d).full) pdone++;
    const ptot=b-a+1, ppct=Math.round(pdone/ptot*100);
    html+=`<div class="phase-block">
      <div class="phase-bar">
        <div><div class="pn">Phase ${ph.id} · ${ph.name}</div>
          <div style="color:var(--ink-soft);font-size:12.5px;margin-top:2px">${ph.blurb}</div></div>
        <div style="text-align:right">
          <div class="pdays">Days ${a}–${b}</div>
          <div class="ptrack" style="margin-top:6px"><div class="pfill" style="width:${ppct}%"></div></div>
        </div>
      </div>
      <div class="daylist">`;
    for(let d=a;d<=b;d++){
      const c=dayCompletion(d);
      let cls='todo',label='To do';
      if(c.full){cls='done';label='Done';}
      else if(c.done){cls='partial';label=c.done+'/'+c.total;}
      if(d===sug&&!c.full)cls+=' current';
      html+=`<div class="dayrow ${cls}" data-goday="${d}">
        <span class="dnum">DAY ${d}</span>
        <span class="dttl">${PLAN[d-1].title}</span>
        <span class="dstate">${d===sug&&!c.full?'Today':label}</span>
      </div>`;
    }
    html+='</div></div>';
  });
  return html+'</div>';
}
