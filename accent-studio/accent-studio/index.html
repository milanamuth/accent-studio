<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Accent Studio — 60-Day American Accent Trainer</title>
<meta name="description" content="A 60-day structured program to build a natural American accent: daily drills, in-app voice recording, progress dashboard and spaced-repetition weak-spot drills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191512; --panel:#221d18; --panel-2:#2a241d;
    --line-solid:#3a3128; --ink:#f1e9dc; --ink-soft:#c4b9a6; --ink-faint:#8a7f6d;
    --amber:#e9a23b; --coral:#e0734a; --sage:#8fae6e; --sky:#7fa8c4; --plum:#c98bb9;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  body{
    background-image:
      radial-gradient(900px 500px at 88% -8%, rgba(233,162,59,.10), transparent 60%),
      radial-gradient(700px 400px at 5% 102%, rgba(224,115,74,.08), transparent 60%);
    min-height:100vh; padding:0 0 90px;
  }
  ::selection{background:var(--amber);color:#1a140c}
  h1,h2,h3,.serif{font-family:'Fraunces',serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  a{color:var(--amber)}

  header{padding:34px 0 18px;border-bottom:1px solid var(--line-solid);margin-bottom:24px}
  .brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .brand h1{font-size:clamp(28px,4.6vw,46px);font-weight:600;line-height:1.02;margin-top:6px;letter-spacing:-.01em}
  .brand h1 em{font-style:italic;color:var(--coral)}
  .brand p{color:var(--ink-soft);margin-top:8px;font-size:14.5px;max-width:48ch}
  .setup-btn{background:transparent;border:1px solid var(--line-solid);color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;padding:9px 14px;border-radius:8px;cursor:pointer;transition:.2s}
  .setup-btn:hover{border-color:var(--amber);color:var(--amber)}

  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:24px;background:var(--panel);
    padding:5px;border-radius:13px;border:1px solid var(--line-solid);width:fit-content}
  .tab{font-family:'Hanken Grotesk';font-weight:600;font-size:13px;color:var(--ink-faint);
    background:transparent;border:0;padding:9px 15px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--amber);color:#1a140c}

  .view{display:none;animation:fade .35s ease}
  .view.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line-solid);border-radius:15px;padding:22px}
  .grid{display:grid;gap:16px}
  .section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}

  .dash-top{display:grid;grid-template-columns:300px 1fr;gap:16px}
  @media(max-width:780px){.dash-top{grid-template-columns:1fr}}
  .ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring-wrap{position:relative;width:188px;height:188px}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center .big{font-family:'Fraunces',serif;font-size:52px;font-weight:600;line-height:1}
  .ring-center .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-faint);text-transform:uppercase;margin-top:3px}
  .ring-sub{margin-top:14px;color:var(--ink-soft);font-size:13.5px}
  .ring-sub b{color:var(--amber)}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .stat{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;padding:16px 17px;position:relative;overflow:hidden}
  .stat .num{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1}
  .stat .cap{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
  .stat .glyph{position:absolute;right:12px;top:10px;font-size:20px;opacity:.5}
  .stat.s-streak .num{color:var(--coral)} .stat.s-min .num{color:var(--amber)}
  .stat.s-done .num{color:var(--sage)} .stat.s-rec .num{color:var(--sky)}

  .radar-card,.heat-card{margin-top:16px}
  .radar-flex{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:center}
  @media(max-width:680px){.radar-flex{grid-template-columns:1fr}}
  .legend{display:flex;flex-direction:column;gap:9px}
  .legend .row{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .legend .bar-track{flex:1;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden}
  .legend .bar-fill{height:100%;border-radius:4px}
  .legend .val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);width:34px;text-align:right}

  .heat{display:flex;flex-wrap:wrap;gap:4px}
  .heat .cell{width:15px;height:15px;border-radius:3.5px;background:var(--panel-2);border:1px solid var(--line-solid)}
  .heat .cell.l1{background:rgba(233,162,59,.28)} .heat .cell.l2{background:rgba(233,162,59,.55)}
  .heat .cell.l3{background:var(--amber)}
  .heat .cell.today{box-shadow:0 0 0 2px var(--coral)}
  .heat-key{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--ink-faint)}
  .heat-key .cell{width:12px;height:12px;border-radius:3px}

  /* dashboard drills */
  .dash-drill{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 13px;background:var(--panel-2);border:1px solid var(--line-solid);border-radius:11px;margin-bottom:8px}
  .dash-drill:last-child{margin-bottom:0}
  .dd-label{font-weight:700;font-size:14px}
  .dd-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:2px}

  /* today */
  .day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .day-nav{display:flex;gap:6px;align-items:center}
  .navbtn{background:var(--panel-2);border:1px solid var(--line-solid);color:var(--ink-soft);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;transition:.18s}
  .navbtn:hover{border-color:var(--amber);color:var(--amber)}
  .navbtn:disabled{opacity:.3;cursor:not-allowed}
  .phase-pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:20px;
    background:rgba(233,162,59,.13);color:var(--amber);border:1px solid rgba(233,162,59,.25)}
  .day-title{font-family:'Fraunces',serif;font-size:clamp(24px,3.6vw,34px);font-weight:600;margin:10px 0 4px;letter-spacing:-.01em}
  .day-why{color:var(--ink-soft);font-size:14.5px;font-style:italic;font-family:'Fraunces',serif;max-width:62ch}
  .day-meta{display:flex;gap:18px;margin:16px 0 4px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);
    font-family:'JetBrains Mono',monospace}
  .day-meta b{color:var(--ink-soft)}

  .ex{display:flex;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line-solid)}
  .ex:last-child{border-bottom:0}
  .ex .check{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-solid);
    background:var(--panel-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.16s;margin-top:1px;font-size:14px;color:transparent}
  .ex .check:hover{border-color:var(--amber)}
  .ex.done .check{background:var(--sage);border-color:var(--sage);color:#1a140c}
  .ex .body{flex:1}
  .ex .etitle{font-weight:700;font-size:15px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .ex .emin{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--amber);
    border:1px solid rgba(233,162,59,.3);padding:2px 7px;border-radius:20px}
  .ex .edesc{color:var(--ink-soft);font-size:13.5px;margin-top:5px;line-height:1.55}
  .ex.done .etitle,.ex.done .edesc{opacity:.5;text-decoration:line-through;text-decoration-color:var(--ink-faint)}
  .listen{margin-top:16px;background:var(--panel-2);border:1px solid var(--line-solid);
    border-left:3px solid var(--sky);border-radius:0 11px 11px 0;padding:13px 16px;font-size:13.5px;color:var(--ink-soft)}
  .listen b{color:var(--sky);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  .day-progress{margin-top:18px;display:flex;align-items:center;gap:13px}
  .dp-track{flex:1;height:8px;background:var(--panel-2);border-radius:5px;overflow:hidden}
  .dp-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));border-radius:5px;transition:.4s}
  .dp-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}

  .btn{font-family:'Hanken Grotesk';font-weight:700;font-size:13.5px;border-radius:10px;
    padding:11px 18px;cursor:pointer;border:1px solid var(--line-solid);transition:.18s;color:var(--ink)}
  .btn.primary{background:var(--amber);color:#1a140c;border-color:var(--amber)}
  .btn.primary:hover{background:#f2b257}
  .btn.ghost{background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
  .btn.mini{padding:7px 12px;font-size:12px;border-radius:8px}

  /* recorder */
  .rec-stage{display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;padding:22px 18px}
  .rec-start{background:var(--coral);border-color:var(--coral);color:#1a140c;font-size:15px;
    display:flex;align-items:center;gap:9px;padding:13px 24px}
  .rec-start:hover{background:#e8855f}
  .rec-dot{width:11px;height:11px;border-radius:50%;background:#1a140c;display:inline-block}
  .rec-hint{color:var(--ink-faint);font-size:12.5px;text-align:center;max-width:46ch}
  .rec-stage.recording{border-color:rgba(224,115,74,.5)}
  .rec-pulse{width:26px;height:26px;border-radius:50%;background:var(--coral);
    animation:pulse 1.1s infinite ease-in-out}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
  .rec-timer{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--coral)}
  .rec-stop{background:transparent;border-color:var(--coral);color:var(--coral)}
  .rec-stop:hover{background:rgba(224,115,74,.12)}
  .rec-stage.review{align-items:stretch}
  .rec-review-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);text-align:center}
  .rec-bench{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:10px;cursor:pointer}
  .rec-bench input{width:16px;height:16px;accent-color:var(--amber)}
  .rec-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
  .rec-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .rec-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel-2);border:1px solid var(--line-solid);border-radius:11px;padding:11px 13px}
  .rec-play{flex:none;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#1a140c;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:.15s}
  .rec-play:hover{background:#f2b257}
  .rec-meta{flex:1;min-width:140px}
  .rec-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rec-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:3px}
  .rec-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    background:rgba(127,168,196,.16);color:var(--sky);padding:2px 7px;border-radius:20px;border:1px solid rgba(127,168,196,.3)}
  .rec-del{flex:none;background:transparent;border:1px solid var(--line-solid);color:var(--ink-faint);
    width:30px;height:30px;border-radius:8px;cursor:pointer;transition:.15s}
  .rec-del:hover{border-color:var(--coral);color:var(--coral)}
  .inline-pl{width:100%;margin-top:6px;height:38px}
  .rec-daygroup{margin-bottom:18px}
  .rec-daygroup:last-child{margin-bottom:0}
  .rec-dayhead{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:9px;
    padding-bottom:7px;border-bottom:1px solid var(--line-solid)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:620px){.cmp{grid-template-columns:1fr}}
  .cmp-slot{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:12px;padding:14px}
  .cmp-hint{color:var(--ink-soft);font-size:13px;margin-bottom:14px}

  /* drills */
  .drill-card{background:var(--panel-2);border:1px solid var(--line-solid);border-radius:13px;
    padding:15px 16px;margin-bottom:10px}
  .drill-card.due{border-color:rgba(233,162,59,.4)}
  .drill-card.mastered{opacity:.62}
  .drill-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .drill-label{font-weight:700;font-size:15px}
  .drill-note{color:var(--ink-soft);font-size:13px;margin-top:6px;line-height:1.5}
  .drill-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
  .drill-due{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint)}
  .drill-card.due .drill-due{color:var(--amber)}
  .drill-card.mastered .drill-due{color:var(--sage)}
  .drill-actions{display:flex;gap:8px;flex-wrap:wrap}
  .sr-dots{display:flex;gap:5px}
  .sr-dot{width:9px;height:9px;border-radius:50%;background:var(--line-solid)}
  .sr-dot.on{background:var(--amber)}
  .drill-card.mastered .sr-dot.on{background:var(--sage)}
  .add-spot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.add-spot{grid-template-columns:1fr}}

  /* forms */
  .slider-row{margin-bottom:15px}
  .slider-row .sl-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px}
  .slider-row .sl-head .sv{font-family:'JetBrains Mono',monospace;color:var(--amber)}
  input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:var(--panel-2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--amber);cursor:pointer;border:3px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);
    cursor:pointer;border:3px solid var(--panel)}
  input[type=number],input[type=text],textarea,select{font-family:'Hanken Grotesk';background:var(--panel-2);
    border:1px solid var(--line-solid);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px;width:100%}
  textarea{resize:vertical;min-height:62px}
  label.fld{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}

  .logitem{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-solid)}
  .logitem:last-child{border-bottom:0}
  .logitem .ld{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);width:92px;flex:none}
  .logitem .lmain{flex:1}
  .logitem .lday{font-weight:700;font-size:14px}
  .logitem .lnotes{color:var(--ink-soft);font-size:13px;margin-top:3px}
  .logitem .lscore{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);flex:none}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-style:italic;font-family:'Fraunces',serif}

  .phase-block{margin-bottom:14px}
  .phase-bar{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--panel-2);
    border:1px solid var(--line-solid);border-radius:12px}
  .phase-bar .pn{font-family:'Fraunces',serif;font-size:18px;font-weight:600;flex:1}
  .phase-bar .pdays{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint)}
  .phase-bar .ptrack{width:120px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
  .phase-bar .pfill{height:100%;background:var(--amber);border-radius:4px}
  .daylist{margin-top:8px;display:grid;gap:6px}
  .dayrow{display:flex;align-items:center;gap:13px;padding:11px 14px;background:var(--panel);
    border:1px solid var(--line-solid);border-radius:10px;cursor:pointer;transition:.16s}
  .dayrow:hover{border-color:var(--amber);transform:translateX(3px)}
  .dayrow .dnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);width:46px;flex:none}
  .dayrow .dttl{flex:1;font-size:14px;font-weight:600}
  .dayrow .dstate{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:20px}
  .dayrow.done{border-color:rgba(143,174,110,.4)}
  .dayrow.done .dstate{background:rgba(143,174,110,.16);color:var(--sage)}
  .dayrow.partial .dstate{background:rgba(233,162,59,.14);color:var(--amber)}
  .dayrow.todo .dstate{background:var(--panel-2);color:var(--ink-faint)}
  .dayrow.current{border-color:var(--coral)}

  .modal-bg{position:fixed;inset:0;background:rgba(10,8,6,.78);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-solid);border-radius:16px;
    padding:26px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{font-size:22px;font-weight:600;margin-bottom:6px}
  .modal p{color:var(--ink-soft);font-size:13.5px;margin-bottom:14px;line-height:1.55}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--sage);color:#15140c;font-weight:700;font-size:13.5px;padding:12px 22px;
    border-radius:11px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .res h3{font-size:20px;font-weight:600;margin:22px 0 10px}
  .res h3:first-child{margin-top:0}
  .res p,.res li{color:var(--ink-soft);font-size:14px;line-height:1.65}
  .res ul{padding-left:20px;margin:8px 0}
  .res li{margin:5px 0}
  .res .tag{font-family:'JetBrains Mono',monospace;color:var(--amber);font-size:13px}
  .ipa{font-family:'JetBrains Mono',monospace;color:var(--coral)}
  .loading{text-align:center;padding:60px;color:var(--ink-faint);font-family:'Fraunces',serif;font-style:italic}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brandrow">
      <div class="brand">
        <div class="kicker">60-Day Program · Spoken American English</div>
        <h1>The Accent <em>Studio</em></h1>
        <p>Daily drills, in-app voice recording and spaced-repetition practice for a natural American accent.</p>
      </div>
      <button class="setup-btn" id="setupBtn">⚙ Settings</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-v="dash">Dashboard</button>
    <button class="tab" data-v="today">Today</button>
    <button class="tab" data-v="plan">Full Plan</button>
    <button class="tab" data-v="drills">Drills</button>
    <button class="tab" data-v="progress">Progress</button>
    <button class="tab" data-v="recordings">Recordings</button>
    <button class="tab" data-v="tracker">Tracker</button>
    <button class="tab" data-v="method">Method</button>
  </nav>

<script>
/* ============================================================
   THE ACCENT STUDIO — standalone build (host anywhere)
   Storage: IndexedDB (state + audio). No backend required.
   ============================================================ */

  


/* ---------------- date / derived helpers ---------------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysSinceStart(){
  const a=new Date(STATE.startDate+'T00:00:00'), b=new Date(todayStr()+'T00:00:00');
  return Math.floor((b-a)/86400000);
}
function suggestedDay(){ return Math.min(60,Math.max(1,daysSinceStart()+1)); }
function dayCompletion(d){
  const arr=STATE.completed[d]||[]; const total=PLAN[d-1].ex.length;
  const done=arr.filter(Boolean).length;
  return {done,total,pct:total?Math.round(done/total*100):0,full:done===total&&total>0};
}
function fullyDoneCount(){ let n=0; for(let d=1;d<=60;d++){ if(dayCompletion(d).full) n++; } return n; }
function totalMinutes(){ return STATE.logs.reduce((s,l)=>s+(+l.minutes||0),0); }
function streak(){
  const dates=new Set(STATE.logs.map(l=>l.date));
  let s=0, cur=new Date(todayStr()+'T00:00:00');
  if(!dates.has(todayStr())) cur.setDate(cur.getDate()-1);
  while(dates.has(cur.toISOString().slice(0,10))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}
function avgRatings(){
  const rated=STATE.logs.filter(l=>l.ratings);
  if(!rated.length) return null;
  const o={}; SKILLS.forEach(s=>{
    o[s.k]=Math.round(rated.reduce((a,l)=>a+(+l.ratings[s.k]||0),0)/rated.length*10)/10;
  });
  return o;
}
function spotDue(s){ return !s.mastered && s.dueDate<=todayStr(); }
function dueSpots(){ return STATE.weakSpots.filter(spotDue); }
function activeSpots(){ return STATE.weakSpots.filter(s=>!s.mastered); }
function masteredSpots(){ return STATE.weakSpots.filter(s=>s.mastered); }

/* ============================================================
   PERSONALIZATION + WEIGHTED ACCENT SCORE
   ============================================================ */
/* Base impact weights: how much each skill matters to sounding American. */
const BASE_WEIGHTS={ r:1.2, vowels:1.15, t:1.0, rhythm:1.3, intonation:1.15, fluency:0.9 };

/* Personalized weights: amplify the user's weakest skills (from baseline) so
   improving real weaknesses moves the score the most. */
function personalWeights(){
  const w=Object.assign({},BASE_WEIGHTS);
  const base=STATE.baseline&&STATE.baseline.scores;
  if(base){
    // rank skills by baseline score ascending; boost the lowest two.
    const ranked=SKILLS.map(s=>({k:s.k,v:+base[s.k]||0})).sort((a,b)=>a.v-b.v);
    if(ranked[0]) w[ranked[0].k]*=1.4;
    if(ranked[1]) w[ranked[1].k]*=1.2;
  }
  return w;
}
/* Weighted Accent Score 0-100 from a {scores} object (each 0-10). */
function accentScore(scores){
  if(!scores) return null;
  const w=personalWeights();
  let num=0,den=0;
  SKILLS.forEach(s=>{ const v=+scores[s.k]; if(Number.isFinite(v)){ num+=v*w[s.k]; den+=w[s.k]; } });
  if(!den) return null;
  return Math.round((num/den)*10);
}
/* The latest real (AI) scores we have, preferring AI assessments over self-ratings. */
function latestAIScores(){
  const withFb=STATE.recordings.filter(r=>r.feedback&&r.feedback.scores).sort((a,b)=>(a.feedback.ts||0)-(b.feedback.ts||0));
  if(withFb.length) return withFb[withFb.length-1].feedback.scores;
  return null;
}
/* Time-ordered score history (AI assessments) for trend charts. */
function scoreHistory(){
  return STATE.recordings.filter(r=>r.feedback&&r.feedback.scores)
    .map(r=>({date:r.date, ts:r.feedback.ts||r.ts, scores:r.feedback.scores,
      overall:accentScore(r.feedback.scores), day:r.day}))
    .sort((a,b)=>a.ts-b.ts);
}
function currentAccentScore(){ return accentScore(latestAIScores()); }
function baselineAccentScore(){ return STATE.baseline?accentScore(STATE.baseline.scores):null; }
/* Capture a baseline the first time we get AI scores (or via Set baseline). */
function maybeCaptureBaseline(rec){
  if(STATE.baseline) return;
  if(rec&&rec.feedback&&rec.feedback.scores){
    STATE.baseline={ scores:Object.assign({},rec.feedback.scores), date:rec.date, day:rec.day, fromRec:rec.id };
  }
}
function skillDelta(k){
  const base=STATE.baseline&&STATE.baseline.scores, cur=latestAIScores();
  if(!base||!cur) return null;
  const d=(+cur[k]||0)-(+base[k]||0);
  return d;
}

/* ============================================================
   GAMIFICATION: XP, LEVELS, ACHIEVEMENTS
   ============================================================ */
const LEVELS=[
  {name:'Foundation', min:0},
  {name:'Shaping', min:300},
  {name:'Flowing', min:800},
  {name:'Fluent', min:1600},
  {name:'Near-Native', min:2800},
  {name:'Studio Master', min:4500},
];
/* XP is DERIVED from genuine progress, never from button-mashing.
   This keeps incentives honest and Gemini calls low. */
function computeXP(){
  let xp=0;
  // 20 XP per fully completed day
  xp += fullyDoneCount()*20;
  // 4 XP per individual exercise checked (partial-day credit)
  let exDone=0; for(let d=1;d<=60;d++){ exDone+=(STATE.completed[d]||[]).filter(Boolean).length; }
  xp += exDone*4;
  // 15 XP per logged practice session
  xp += STATE.logs.length*15;
  // 40 XP per mastered drill
  xp += masteredSpots().length*40;
  // 25 XP per benchmark recording that has AI feedback (one per recording, capped)
  xp += STATE.recordings.filter(r=>r.benchmark&&r.feedback).length*25;
  // 30 XP per practice-streak day (rewards consistency)
  xp += streak()*30;
  // Progress bonus: 10 XP per point of Accent-Score improvement over baseline
  const base=baselineAccentScore(), cur=currentAccentScore();
  if(base!=null&&cur!=null&&cur>base) xp += (cur-base)*10;
  return Math.round(xp);
}
function levelFor(xp){
  let lv=LEVELS[0], idx=0;
  for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].min){ lv=LEVELS[i]; idx=i; } }
  const next=LEVELS[idx+1]||null;
  const floor=lv.min, ceil=next?next.min:lv.min;
  const pct=next?Math.round((xp-floor)/(ceil-floor)*100):100;
  return {level:lv, idx, next, pct, xp};
}
/* Achievements: each has id, label, icon, and a test() against STATE. */
const ACHIEVEMENTS=[
  {id:'first_rec', icon:'🎙', label:'First recording', desc:'Record your very first take.',
   test:()=>STATE.recordings.length>=1},
  {id:'baseline', icon:'📍', label:'Baseline set', desc:'Capture your Day 1 baseline assessment.',
   test:()=>!!STATE.baseline},
  {id:'first_ai', icon:'✨', label:'First AI coaching', desc:'Get your first AI assessment.',
   test:()=>STATE.recordings.some(r=>r.feedback)},
  {id:'streak3', icon:'🔥', label:'3-day streak', desc:'Practice three days in a row.',
   test:()=>streak()>=3 || bestStreak()>=3},
  {id:'streak7', icon:'🔥', label:'Week warrior', desc:'Practice seven days in a row.',
   test:()=>bestStreak()>=7},
  {id:'drills5', icon:'🎯', label:'Sharpshooter', desc:'Master five weak-spot drills.',
   test:()=>masteredSpots().length>=5},
  {id:'days10', icon:'✅', label:'Ten down', desc:'Fully complete ten days.',
   test:()=>fullyDoneCount()>=10},
  {id:'days30', icon:'🏅', label:'Halfway hero', desc:'Reach the 30-day milestone.',
   test:()=>fullyDoneCount()>=30},
  {id:'improve5', icon:'📈', label:'Climbing', desc:'Raise your Accent Score 5+ points over baseline.',
   test:()=>{const b=baselineAccentScore(),c=currentAccentScore();return b!=null&&c!=null&&(c-b)>=5;}},
  {id:'improve15', icon:'🚀', label:'Transformed', desc:'Raise your Accent Score 15+ points over baseline.',
   test:()=>{const b=baselineAccentScore(),c=currentAccentScore();return b!=null&&c!=null&&(c-b)>=15;}},
  {id:'score75', icon:'⭐', label:'Solid speaker', desc:'Reach an Accent Score of 75.',
   test:()=>{const c=currentAccentScore();return c!=null&&c>=75;}},
  {id:'finish', icon:'👑', label:'Studio graduate', desc:'Complete all 60 days.',
   test:()=>fullyDoneCount()>=60},
];
function bestStreak(){
  const dates=[...new Set(STATE.logs.map(l=>l.date))].sort();
  let best=0,run=0,prev=null;
  dates.forEach(ds=>{
    if(prev && (new Date(ds)-new Date(prev))===86400000) run++; else run=1;
    if(run>best) best=run; prev=ds;
  });
  return best;
}
function earnedAchievements(){ return ACHIEVEMENTS.filter(a=>{ try{return a.test();}catch(e){return false;} }); }
/* Detect newly-earned achievements to toast them. */
function syncAchievements(){
  if(!Array.isArray(STATE.earned)) STATE.earned=[];
  const now=earnedAchievements().map(a=>a.id);
  const fresh=now.filter(id=>!STATE.earned.includes(id));
  STATE.earned=now;
  return fresh;
}
function celebrate(freshIds){
  if(!freshIds||!freshIds.length) return;
  const a=ACHIEVEMENTS.find(x=>x.id===freshIds[0]);
  if(a) toast(a.icon+' Achievement: '+a.label);
}

/* daily quest: today's session done + at least one due drill practiced today */
function questStatus(){
  const d=suggestedDay();
  const sessionDone=dayCompletion(d).full;
  const practicedToday=STATE.weakSpots.some(s=>(s.history||[]).includes(todayStr()));
  const loggedToday=STATE.logs.some(l=>l.date===todayStr());
  const items=[
    {label:'Complete today\u2019s session', done:sessionDone},
    {label:'Practice one due drill', done:practicedToday || dueSpots().length===0},
    {label:'Log your practice', done:loggedToday},
  ];
  const done=items.filter(i=>i.done).length;
  return {items, done, total:items.length, complete:done===items.length};
}

function fmtDur(s){ s=Math.max(0,Math.round(s||0)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isBenchDay(d){ return BENCH_DAYS.indexOf(d)>=0; }
function autoLabel(d){ return isBenchDay(d)?('Benchmark — Day '+d+(d===1?' baseline':'')):('Day '+d+' practice'); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ============================================================
   RECORDER
   ============================================================ */
const Rec={mediaRecorder:null,chunks:[],stream:null,startTs:0,timer:null,active:false,
  pendingBlob:null,pendingUrl:null,pendingDur:0,mime:''};

function pickMime(){
  if(!window.MediaRecorder) return '';
  const opts=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const o of opts){ try{ if(MediaRecorder.isTypeSupported(o)) return o; }catch(e){} }
  return '';
}
async function recStart(){
  if(Rec.active) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Recording needs a modern browser served over HTTPS.'); return;
  }
  try{ Rec.stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('Microphone access was blocked.'); return; }
  const mime=pickMime();
  try{ Rec.mediaRecorder=mime?new MediaRecorder(Rec.stream,{mimeType:mime}):new MediaRecorder(Rec.stream); }
  catch(e){ try{ Rec.mediaRecorder=new MediaRecorder(Rec.stream); }catch(e2){ toast('Recording not supported here.'); return; } }
  Rec.chunks=[]; Rec.mime=Rec.mediaRecorder.mimeType||mime||'audio/webm';
  Rec.mediaRecorder.ondataavailable=e=>{ if(e.data&&e.data.size) Rec.chunks.push(e.data); };
  Rec.mediaRecorder.onstop=()=>{
    const blob=new Blob(Rec.chunks,{type:Rec.mime});
    Rec.pendingBlob=blob;
    Rec.pendingDur=Math.round((Date.now()-Rec.startTs)/1000);
    if(Rec.pendingUrl) URL.revokeObjectURL(Rec.pendingUrl);
    Rec.pendingUrl=URL.createObjectURL(blob);
    Rec.active=false; clearInterval(Rec.timer);
    (Rec.stream?Rec.stream.getTracks():[]).forEach(t=>t.stop());
    renderRecorder();
  };
  Rec.startTs=Date.now(); Rec.active=true;
  try{ Rec.mediaRecorder.start(); }catch(e){ Rec.active=false; toast('Could not start recording.'); return; }
  Rec.timer=setInterval(()=>{
    const el=document.getElementById('recTimer');
    if(el) el.textContent=fmtDur((Date.now()-Rec.startTs)/1000);
  },250);
  renderRecorder();
}
function recStop(){ if(Rec.mediaRecorder&&Rec.active){ try{ Rec.mediaRecorder.stop(); }catch(e){} } }
function discardPending(){
  if(Rec.pendingUrl) URL.revokeObjectURL(Rec.pendingUrl);
  Rec.pendingBlob=null; Rec.pendingUrl=null; Rec.pendingDur=0;
}
async function saveRecording(){
  if(!Rec.pendingBlob) return;
  const d=STATE.viewDay||suggestedDay();
  const labelEl=document.getElementById('recLabel');
  const benchEl=document.getElementById('recBench');
  const label=(labelEl&&labelEl.value.trim())||autoLabel(d);
  const id='rec_'+Date.now();
  await audioPut(id,Rec.pendingBlob);
  STATE.recordings.push({id,day:d,date:todayStr(),label,
    benchmark:!!(benchEl&&benchEl.checked),duration:Rec.pendingDur||0,
    mime:Rec.mime,ts:Date.now()});
  await saveState();
  discardPending();
  toast('Recording saved to your library.');
  renderRecorder();
}
async function deleteRecording(id){
  const r=STATE.recordings.find(x=>x.id===id);
  if(!confirm('Delete this recording? "'+(r?r.label:'')+'"')) return;
  await audioDel(id);
  STATE.recordings=STATE.recordings.filter(x=>x.id!==id);
  await saveState();
  render();
}
async function playRec(id){
  const row=document.querySelector('[data-rid="'+id+'"]');
  if(!row) return;
  let pl=row.querySelector('audio.inline-pl');
  if(pl){ pl.play(); return; }
  const blob=await audioGet(id);
  if(!blob){ toast('Audio data not found for this entry.'); return; }
  pl=document.createElement('audio');
  pl.className='inline-pl'; pl.controls=true; pl.autoplay=true;
  pl.src=URL.createObjectURL(blob);
  row.appendChild(pl);
}

/* ============================================================
   RENDER SHELL
   ============================================================ */
const app=document.getElementById('app');
let CURRENT_VIEW='dash';

function render(){
  const v=CURRENT_VIEW;
  if(v==='dash') app.innerHTML=viewDash();
  else if(v==='today') app.innerHTML=viewToday();
  else if(v==='plan') app.innerHTML=viewPlan();
  else if(v==='drills') app.innerHTML=viewDrills();
  else if(v==='progress') app.innerHTML=viewProgress();
  else if(v==='recordings') app.innerHTML=viewRecordings();
  else if(v==='tracker') app.innerHTML=viewTracker();
  else if(v==='method') app.innerHTML=viewMethod();
  bindView();
  if(v==='today') renderRecorder();
  if(v==='recordings') initCompare();
  if(v==='method') renderSyncUI();        // ← add this line
}

/* ---------------- DASHBOARD ---------------- */
function viewDash(){
  const done=fullyDoneCount(), pctComplete=Math.round(done/60*100);
  const sug=suggestedDay();
  const acc=currentAccentScore();
  const base=baselineAccentScore();
  const tgt=STATE.targetScore||85;
  const circ=2*Math.PI*82;
  const ringPct=acc!=null?acc:0;
  const ring=`<svg width="188" height="188" viewBox="0 0 188 188">
    <circle cx="94" cy="94" r="82" fill="none" stroke="#2a241d" stroke-width="13"/>
    <circle cx="94" cy="94" r="82" fill="none" stroke="url(#g1)" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-ringPct/100)}"
      transform="rotate(-90 94 94)" style="transition:stroke-dashoffset .8s ease"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a23b"/><stop offset="1" stop-color="#e0734a"/>
    </linearGradient></defs></svg>`;
  const av=avgRatings();
  const lv=levelFor(computeXP());
  const deltaTxt=(acc!=null&&base!=null)
    ? (acc>=base?`<b style="color:var(--sage)">+${acc-base}</b> since baseline`:`<b>${acc-base}</b> since baseline`)
    : (acc==null?'Record a benchmark to get your score':'Baseline set');

  const ringCenter = acc!=null
    ? `<div class="big">${acc}</div><div class="lbl">Accent Score</div>`
    : `<div class="big" style="font-size:30px">—</div><div class="lbl">Accent Score</div>`;

  return `
  <div class="view show">
    <div class="dash-top">
      <div class="card ring-card">
        <div class="ring-wrap">${ring}
          <div class="ring-center">${ringCenter}</div></div>
        <div class="ring-sub">${deltaTxt}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card" style="padding:18px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div><div class="section-label" style="margin:0 0 4px">Level ${lv.idx+1} · ${lv.level.name}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)">${lv.xp} XP${lv.next?` · ${lv.next.min-lv.xp} to ${lv.next.name}`:' · max level'}</div></div>
            <div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--amber)">${lv.idx+1}</div>
          </div>
          <div class="dp-track" style="margin-top:12px"><div class="dp-fill" style="width:${lv.pct}%"></div></div>
        </div>
        <div class="stat-grid">
          <div class="stat s-streak"><span class="glyph">🔥</span><div class="num">${streak()}</div>
            <div class="cap">Day streak</div></div>
          <div class="stat s-done"><span class="glyph">✓</span><div class="num">${done}</div>
            <div class="cap">Days complete</div></div>
          <div class="stat s-min"><span class="glyph">⏱</span><div class="num">${totalMinutes()}</div>
            <div class="cap">Minutes logged</div></div>
          <div class="stat s-rec"><span class="glyph">🎙</span><div class="num">${STATE.recordings.length}</div>
            <div class="cap">Recordings</div></div>
        </div>
      </div>
    </div>

    ${dashQuest()}

    ${dashDrills()}

    <div class="card radar-card">
      <div class="section-label">Skill Profile ${latestAIScores()?'· latest AI assessment':'· self-rated average'}</div>
      ${drawRadar(latestAIScores()||av)}
    </div>

    <div class="card" style="margin-top:16px">
      <div class="section-label">Achievements · ${earnedAchievements().length} of ${ACHIEVEMENTS.length}</div>
      ${dashBadges()}
    </div>

    <div class="card heat-card">
      <div class="section-label">Consistency · last 9 weeks</div>
      ${drawHeat()}
    </div>

    <div class="card" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div><div class="section-label" style="margin-bottom:4px">Next up · ${pctComplete}% of program done</div>
        <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:600">Day ${sug}: ${PLAN[sug-1].title}</div>
        <div style="color:var(--ink-soft);font-size:13.5px;margin-top:3px">${PHASES[PLAN[sug-1].p-1].name}</div></div>
      <button class="btn primary" data-goday="${sug}">Go to today's session →</button>
    </div>
  </div>`;
}

function dashQuest(){
  const q=questStatus();
  const items=q.items.map(i=>`<div style="display:flex;align-items:center;gap:9px;font-size:13.5px;color:${i.done?'var(--ink-faint)':'var(--ink)'}">
    <span style="width:18px;height:18px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
      background:${i.done?'var(--sage)':'var(--panel-2)'};border:1px solid ${i.done?'var(--sage)':'var(--line-solid)'};color:#1a140c;font-size:11px">${i.done?'✓':''}</span>
    <span style="${i.done?'text-decoration:line-through':''}">${i.label}</span></div>`).join('');
  return `<div class="card" style="margin-top:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px">
      <div class="section-label" style="margin:0">Daily quest ${q.complete?'· complete 🎉':`· ${q.done}/${q.total}`}</div>
      <div class="dp-track" style="max-width:120px"><div class="dp-fill" style="width:${q.done/q.total*100}%"></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">${items}</div>
  </div>`;
}

function dashBadges(){
  const earned=new Set(earnedAchievements().map(a=>a.id));
  return `<div style="display:flex;gap:10px;flex-wrap:wrap">${ACHIEVEMENTS.map(a=>{
    const got=earned.has(a.id);
    return `<div title="${escapeHtml(a.label)}: ${escapeHtml(a.desc)}" style="display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;text-align:center;opacity:${got?1:.32}">
      <div style="width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;
        background:${got?'rgba(233,162,59,.14)':'var(--panel-2)'};border:1px solid ${got?'rgba(233,162,59,.4)':'var(--line-solid)'};filter:${got?'none':'grayscale(1)'}">${a.icon}</div>
      <div style="font-size:10px;line-height:1.2;color:var(--ink-faint)">${escapeHtml(a.label)}</div>
    </div>`;
  }).join('')}</div>`;
}

function dashDrills(){
  if(!STATE.weakSpots.length){
    return `<div class="card" style="margin-top:16px">
      <div class="section-label">Weak-spot drills</div>
      <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.6">No weak spots tracked yet. As you record yourself,
      add the sounds you keep slipping on in the <b>Drills</b> tab. Each one resurfaces on a spaced schedule
      (1 → 3 → 7 → 14 days) until it is mastered.</p>
      <div style="margin-top:13px"><button class="btn ghost" data-gotab="drills">Open Drills →</button></div>
    </div>`;
  }
  const due=dueSpots();
  if(!due.length){
    return `<div class="card" style="margin-top:16px">
      <div class="section-label">Weak-spot drills</div>
      <p style="color:var(--ink-soft);font-size:13.5px">Nothing due today.
      <b>${activeSpots().length}</b> drill(s) scheduled · <b>${masteredSpots().length}</b> mastered.</p>
    </div>`;
  }
  const items=due.map(s=>{

function drawRadar(av){
  const cx=140,cy=140,R=104,n=SKILLS.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{
    rings+=`<polygon points="${SKILLS.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#3a3128" stroke-width="1"/>`;
  });
  let axes='',labels='';
  SKILLS.forEach((s,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3128" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+22);
    labels+=`<text x="${lx}" y="${ly}" fill="#8a7f6d" font-size="10.5" font-family="JetBrains Mono,monospace"
      text-anchor="middle" dominant-baseline="middle">${s.label.split(' ')[0]}</text>`;
  });
  let shape='',dots='';
  if(av){
    const pts=SKILLS.map((s,i)=>pt(i,R*(av[s.k]/10)));
    shape=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(233,162,59,.22)" stroke="#e9a23b" stroke-width="2"/>`;
    dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${SKILLS[i].color}"/>`).join('');
  }
  const legend=SKILLS.map(s=>{
    const v=av?av[s.k]:0;
    return `<div class="row"><span class="dot" style="background:${s.color}"></span>
      <span style="flex:1">${s.label}</span>
      <span class="bar-track" style="max-width:90px"><span class="bar-fill" style="width:${v*10}%;background:${s.color}"></span></span>
      <span class="val">${av?v.toFixed(1):'—'}</span></div>`;
  }).join('');
  return `<div class="radar-flex">
    <svg width="280" height="280" viewBox="0 0 280 280">${rings}${axes}${shape}${dots}${labels}</svg>
    <div class="legend">${legend}
      ${!av?'<div style="color:var(--ink-faint);font-style:italic;font-size:13px;margin-top:8px">Log your first practice session to build your skill profile.</div>':''}
    </div></div>`;
}
function drawHeat(){
  const mins={}; STATE.logs.forEach(l=>{ mins[l.date]=(mins[l.date]||0)+(+l.minutes||0); });
  let cells=''; const today=todayStr();
  for(let i=62;i>=0;i--){
    const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10); const m=mins[ds]||0;
    let cls='cell';
    if(m>0&&m<20)cls+=' l1'; else if(m>=20&&m<40)cls+=' l2'; else if(m>=40)cls+=' l3';
    if(ds===today)cls+=' today';
    cells+=`<div class="${cls}" title="${ds}: ${m} min"></div>`;
  }
  return `<div class="heat">${cells}</div>
    <div class="heat-key"><span>Less</span><span class="cell"></span><span class="cell l1"></span>
      <span class="cell l2"></span><span class="cell l3"></span><span>More</span></div>`;
}

/* ============================================================
   AI FEEDBACK (Gemini via /api/feedback serverless function)
   ============================================================ */
const AI={ endpoint:'/api/feedback', maxSeconds:90 };

function abToB64(buf){
  let bin=''; const bytes=new Uint8Array(buf); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function encodeWav(samples,rate){
  const buf=new ArrayBuffer(44+samples.length*2), view=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); view.setUint32(4,36+samples.length*2,true); w(8,'WAVE');
  w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,rate,true); view.setUint32(28,rate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  w(36,'data'); view.setUint32(40,samples.length*2,true);
  let o=44; for(let i=0;i<samples.length;i++){ let s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return buf;
}
async function blobToWavB64(blob,targetRate){
  targetRate=targetRate||16000;
  const arr=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) throw new Error('no-audio-context');
  const ctx=new AC();
  let decoded;
  try{ decoded=await ctx.decodeAudioData(arr.slice(0)); }
  catch(e){ ctx.close&&ctx.close(); throw new Error('decode-failed'); }
  const len=decoded.length, chans=decoded.numberOfChannels;
  const mono=new Float32Array(len);
  for(let c=0;c<chans;c++){ const d=decoded.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/chans; }
  const ratio=decoded.sampleRate/targetRate;
  let outLen=Math.floor(len/ratio);
  const maxSamples=AI.maxSeconds*targetRate;
  if(outLen>maxSamples) outLen=maxSamples; // cap length to stay under request limits
  const out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++) out[i]=mono[Math.floor(i*ratio)]||0;
  ctx.close&&ctx.close();
  return abToB64(encodeWav(out,targetRate));
}

async function aiFeedback(recId){
  const rec=STATE.recordings.find(r=>r.id===recId);
  if(!rec) return;
  if(rec.feedback){ showFeedbackModal(rec); return; }
  showFeedbackLoading();
  let blob;
  try{ blob=await audioGet(recId); }catch(e){}
  if(!blob){ showFeedbackError('The audio for this recording could not be found.'); return; }
  let wavB64;
  try{ wavB64=await blobToWavB64(blob); }
  catch(e){ showFeedbackError('This recording could not be processed in your browser. Try a recording made in this same browser.'); return; }
  const day=PLAN[rec.day-1];
  const referenceText = rec.benchmark?RAINBOW:'';

  // On benchmark days, first get objective phoneme scores from Azure (if configured),
  // then feed them into the AI coach so its advice is grounded in hard numbers.
  let azure=null;
  if(referenceText){
    try{
      const sc=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({audioBase64:wavB64, referenceText})});
      if(sc.ok){ const sj=await sc.json(); if(sj&&sj.ok) azure=sj; }
      // a 404/500 just means Azure isn't set up yet; we silently fall back to AI-only.
    }catch(e){ /* Azure optional; ignore and continue with AI-only */ }
  }

  const payload={
    audioBase64:wavB64, mimeType:'audio/wav',
    day:rec.day, title:day?day.title:('Day '+rec.day),
    referenceText,
    focus: day?day.title:'',
    weakSpots: activeSpots().map(s=>s.label).slice(0,6),
    azure
  };
  let res,data;
  try{ res=await fetch(AI.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
  catch(e){ showFeedbackError('Could not reach the feedback service. If you are viewing this as a local file, deploy to Vercel first — the AI function only runs when hosted.'); return; }
  if(!res.ok){
    let msg='The feedback service returned an error ('+res.status+').';
    try{ const j=await res.json(); if(j&&j.error) msg=j.error; }catch(e){}
    if(res.status===404) msg='Feedback function not found. Make sure the /api/feedback file is deployed and you have set the GEMINI_API_KEY environment variable in Vercel.';
    if(res.status===413) msg='That recording is too long to analyze. Keep takes under about 90 seconds. For benchmark days, reading the passage once at a natural pace is plenty.';
    showFeedbackError(msg); return;
  }
  try{ data=await res.json(); }
  catch(e){ showFeedbackError('The feedback service sent a response that could not be read.'); return; }
  if(!data||!data.scores){ showFeedbackError('The model did not return a usable assessment. Try again.'); return; }
  rec.feedback={...data, at:todayStr(), ts:Date.now()};
  maybeCaptureBaseline(rec);
  const fresh=syncAchievements();
  await saveState();
  showFeedbackModal(rec);
  render();
  celebrate(fresh);
}

  const url=URL.createObjectURL(blob); a.dataset.url=url; a.src=url;

function drillCardHtml(s){
  const total=SR_INTERVALS.length+1;
  let dots='';
  const filled=s.mastered?total:s.reps;
  for(let i=0;i<total;i++) dots+=`<span class="sr-dot ${i<filled?'on':''}"></span>`;
  const cls='drill-card '+(s.mastered?'mastered':(spotDue(s)?'due':''));
  const hasPack=(typeof getDrillPack==='function')&&getDrillPack(s.label);
  const practiceBtn=hasPack?`<button class="btn ghost mini" data-openpack="${s.id}">🎧 Practice</button> `:'';
  let actions='';
  if(s.mastered){
    actions=`${practiceBtn}<button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  } else if(spotDue(s)){
    actions=`${hasPack?`<button class="btn primary mini" data-openpack="${s.id}">🎧 Practice</button>`:''}
      <button class="btn ${hasPack?'ghost':'primary'} mini" data-practiced="${s.id}">✓ Practiced</button>
      <button class="btn ghost mini" data-snooze="${s.id}">Snooze 1d</button>
      <button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  } else {
    actions=`${practiceBtn}<button class="btn ghost mini" data-practiced="${s.id}">Practice now</button>
      <button class="btn ghost mini" data-delspot="${s.id}">Remove</button>`;
  }
  const dueTxt=s.mastered?'Mastered':(spotDue(s)?'Due today':'Next review: '+s.dueDate);
  return `<div class="${cls}" data-spot="${s.id}">
    <div class="drill-top">
      <div class="drill-label">${escapeHtml(s.label)}</div>
      <div class="sr-dots" title="${filled} of ${total}">${dots}</div>
    </div>
    ${s.note?`<div class="drill-note">${escapeHtml(s.note)}</div>`:''}
    <div class="drill-foot">
      <span class="drill-due">${dueTxt}</span>
      <div class="drill-actions">${actions}</div>
    </div>
  </div>`;
}
function addSpot(){
  const sel=(document.getElementById('spotSel')||{}).value||'';
  const custom=((document.getElementById('spotCustom')||{}).value||'').trim();
  const note=((document.getElementById('spotNote')||{}).value||'').trim();
  const label=custom||sel;
  if(!label){ toast('Choose a common weak spot or type your own.'); return; }
  STATE.weakSpots.push({id:'ws_'+Date.now(),label,note,reps:0,
    created:todayStr(),dueDate:todayStr(),history:[],mastered:false});
  saveState(); render();
  toast('Added — "'+label+'" is due today.');
}
function practiceSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id); if(!s||s.mastered) return;
  s.history=s.history||[]; s.history.push(todayStr());
  if(s.reps<SR_INTERVALS.length){
    s.dueDate=addDays(todayStr(),SR_INTERVALS[s.reps]);
    s.reps++;
  }
  if(s.reps>=SR_INTERVALS.length){ s.mastered=true; }
  saveState(); render();
  toast(s.mastered?'"'+s.label+'" mastered — nicely done.':'Logged. Next review '+s.dueDate+'.');
}
function snoozeSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id); if(!s) return;
  s.dueDate=addDays(todayStr(),1); saveState(); render();
  toast('Snoozed to tomorrow.');
}
function removeSpot(id){
  const s=STATE.weakSpots.find(w=>w.id===id);
  if(!confirm('Remove the drill "'+(s?s.label:'')+'"?')) return;
  STATE.weakSpots=STATE.weakSpots.filter(w=>w.id!==id);
  saveState(); render();
}

function viewPlan(){

  PHASES.forEach(ph=>{
    const [a,b]=ph.range; let pdone=0;
    for(let d=a;d<=b;d++) if(dayCompletion(d).full) pdone++;
    const ptot=b-a+1, ppct=Math.round(pdone/ptot*100);
    html+=`<div class="phase-block">
      <div class="phase-bar">
        <div><div class="pn">Phase ${ph.id} · ${ph.name}</div>

          <div class="ptrack" style="margin-top:6px"><div class="pfill" style="width:${ppct}%"></div></div>
        </div>
      </div>
      <div class="daylist">`;
    for(let d=a;d<=b;d++){
      const c=dayCompletion(d);
      let cls='todo',label='To do';
      if(c.full){cls='done';label='Done';}
      else if(c.done){cls='partial';label=c.done+'/'+c.total;}
      if(d===sug&&!c.full)cls+=' current';
      html+=`<div class="dayrow ${cls}" data-goday="${d}">

        <span class="dstate">${d===sug&&!c.full?'Today':label}</span>
      </div>`;
    }
    html+='</div></div>';
  });
  return html+'</div>';
}

function drawTrend(hist){
  const W=620,H=220,padL=34,padR=14,padT=16,padB=30;
  const xs=hist.map((h,i)=>hist.length>1?padL+(W-padL-padR)*i/(hist.length-1):padL+(W-padL-padR)/2);
  const ys=hist.map(h=>padT+(H-padT-padB)*(1-(h.overall||0)/100));
  let grid='',labels='';
  [0,25,50,75,100].forEach(v=>{
    const y=padT+(H-padT-padB)*(1-v/100);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#3a3128" stroke-width="1"/>`;
    labels+=`<text x="${padL-7}" y="${y+3}" fill="#8a7f6d" font-size="9.5" font-family="JetBrains Mono,monospace" text-anchor="end">${v}</text>`;
  });
  const tgt=STATE.targetScore||85;
  const ty=padT+(H-padT-padB)*(1-tgt/100);
  const tgtLine=`<line x1="${padL}" y1="${ty}" x2="${W-padR}" y2="${ty}" stroke="#8fae6e" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="${W-padR}" y="${ty-5}" fill="#8fae6e" font-size="9.5" font-family="JetBrains Mono,monospace" text-anchor="end">target ${tgt}</text>`;
  let path='';
  xs.forEach((x,i)=>{ path+=(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)+' '; });
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="#e9a23b"/>
    <text x="${x.toFixed(1)}" y="${(ys[i]-9).toFixed(1)}" fill="#f1e9dc" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">${hist[i].overall}</text>`).join('');
  const xlabels=hist.map((h,i)=>`<text x="${xs[i].toFixed(1)}" y="${H-10}" fill="#8a7f6d" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">D${h.day}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}${tgtLine}${labels}
    <path d="${path}" fill="none" stroke="#e9a23b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlabels}
  </svg>`;
}

  app.querySelectorAll('[data-openpack]').forEach(el=>el.addEventListener('click',()=>{
    const sp=STATE.weakSpots.find(w=>w.id===el.dataset.openpack);
    if(sp && typeof openDrillPack==='function') openDrillPack(sp.label, sp.id);
  }));
  app.querySelectorAll('[data-snooze]').forEach(el=>el.addEventListener('click',()=>snoozeSpot(el.dataset.snooze)));
  app.querySelectorAll('[data-delspot]').forEach(el=>el.addEventListener('click',()=>removeSpot(el.dataset.delspot)));
  bindRecItems(app);
}

function switchTab(v){
  CURRENT_VIEW=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t) switchTab(t.dataset.v);
});

/* ---------------- SETTINGS ---------------- */
document.getElementById('setupBtn').addEventListener('click',openSettings);
function openSettings(){
  const box=document.getElementById('modalBox');
  box.innerHTML=`
    <h3>Settings</h3>
    <p>Program started <b>${STATE.startDate}</b> · today is suggested Day ${suggestedDay()} ·
    ${STATE.recordings.length} recordings · ${STATE.weakSpots.length} drills.</p>

    <label class="fld">Day-60 target Accent Score</label>
    <p style="margin:6px 0 8px">Your goal line on the Progress chart. ${baselineAccentScore()!=null?'Your baseline is '+baselineAccentScore()+'.':'Set after your first benchmark.'}</p>
    <input type="number" id="mTarget" min="40" max="100" value="${STATE.targetScore||85}">

    <label class="fld" style="margin-top:18px">Baseline</label>
    <p style="margin:6px 0 8px">${STATE.baseline?('Captured from Day '+STATE.baseline.day+' ('+STATE.baseline.date+'). This is your fixed comparison point.'):'Not captured yet. Your first AI assessment becomes your baseline automatically.'}</p>
    ${STATE.baseline?'<button class="btn ghost mini" id="mRebase">Reset baseline to latest assessment</button>':''}

    <label class="fld" style="margin-top:18px">Backup &amp; restore</label>
    <p style="margin:6px 0 0">Export saves your progress, scores, drills and goals as a JSON file
    (audio recordings are not included). Import replaces current data with a backup file.</p>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="mExport">↓ Export backup</button>
      <button class="btn ghost" id="mImport">↑ Import backup</button>
      <input type="file" id="mFile" accept="application/json,.json" style="display:none">
    </div>

    <label class="fld" style="margin-top:20px">Program controls</label>
    <div class="modal-actions" style="justify-content:flex-start">
      <button class="btn ghost" id="mRestart" style="color:var(--coral);border-color:var(--coral)">Restart day counter</button>
      <button class="btn primary" id="mWipe" style="background:var(--coral);border-color:var(--coral)">Erase all data</button>
    </div>
    <div class="modal-actions"><button class="btn primary" id="mSave">Save settings</button><button class="btn ghost" id="mClose">Close</button></div>`;
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('mClose').onclick=closeModal;
  document.getElementById('mSave').onclick=()=>{
    const t=+document.getElementById('mTarget').value;
    if(t>=40&&t<=100) STATE.targetScore=t;
    saveState(); closeModal(); switchTab('dash'); toast('Settings saved.');
  };
  const rb=document.getElementById('mRebase');
  if(rb) rb.onclick=()=>{
    const cur=latestAIScores();
    if(!cur){ toast('No assessment to set baseline from.'); return; }
    STATE.baseline={scores:Object.assign({},cur),date:todayStr(),day:suggestedDay(),fromRec:'manual'};
    saveState(); closeModal(); switchTab('progress'); toast('Baseline reset to your latest scores.');
  };
  document.getElementById('mExport').onclick=exportData;
  document.getElementById('mImport').onclick=()=>document.getElementById('mFile').click();
  document.getElementById('mFile').onchange=importData;
  document.getElementById('mRestart').onclick=()=>{
    STATE.startDate=todayStr(); STATE.viewDay=1; saveState(); closeModal(); switchTab('dash');
    toast('Program counter restarted.');
  };
  document.getElementById('mWipe').onclick=async()=>{
    if(confirm('Erase ALL progress, logs, ratings, drills and recordings? This cannot be undone.')){
      await audioClear();
      STATE={startDate:todayStr(),completed:{},logs:[],viewDay:1,recordings:[],weakSpots:[],baseline:null,earned:[],targetScore:85};
      await saveState(); closeModal(); switchTab('dash'); toast('All data erased.');
    }
  };
}
function closeModal(){ const mb=document.getElementById('modalBox'); if(mb) mb.style.maxWidth=''; document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

function exportData(){
  const payload={app:'accent-studio',version:1,exported:new Date().toISOString(),
    state:{startDate:STATE.startDate,completed:STATE.completed,logs:STATE.logs,
      viewDay:STATE.viewDay,weakSpots:STATE.weakSpots,
      baseline:STATE.baseline,earned:STATE.earned,targetScore:STATE.targetScore,
      recordings:STATE.recordings.map(r=>({...r}))}};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='accent-studio-backup-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup file downloaded.');
}
function importData(e){
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const data=JSON.parse(fr.result);
      const st=data.state||data;
      if(!st||!st.startDate) throw new Error('bad file');
      STATE=Object.assign({startDate:todayStr(),completed:{},logs:[],viewDay:1,recordings:[],weakSpots:[]},st);
      if(!Array.isArray(STATE.recordings)) STATE.recordings=[];
      if(!Array.isArray(STATE.weakSpots)) STATE.weakSpots=[];
      await saveState(); closeModal(); switchTab('dash');
      toast('Backup restored. (Audio files are not part of backups.)');
    }catch(err){ toast('That file could not be read as a valid backup.'); }
  };
  fr.readAsText(f);
}

/* ---------------- BOOT ---------------- */
(async function(){
  await bootSync();
  if(!STATE.viewDay) STATE.viewDay=suggestedDay();
  render();
})();
</script>
</body>
</html>
